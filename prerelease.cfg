[AUTOUPDATE]
# Vorab-Kanal ("Prerelease") des Auto-Updates.
#
# Warum es diese Datei ueberhaupt gibt: in plugin.cfg stand bis 1.2.0
#
#     PRERELEASECFG=
#
# also nichts. Wer in LoxBerry den Vorab-Kanal eingestellt hat, bekam
# damit gar keine Aktualisierung mehr - stillschweigend, denn eine leere
# Adresse ist kein Fehler, sie liefert nur nie eine Antwort. Das Plugin
# blieb auf dem installierten Stand stehen, ohne dass irgendwo etwas
# davon zu lesen gewesen waere.
#
# NICHT auf release.cfg zeigen lassen. Das waere die naheliegende
# Abkuerzung und genau falsch: der Vorab-Kanal fuehrte dann dieselbe
# Version wie der stabile, und ein Vorab-Stand liesse sich nie mehr
# ausliefern, ohne alle stabilen Installationen mitzunehmen.
#
# Solange es keinen Vorab-Stand gibt, nennt diese Datei dieselbe Version
# wie release.cfg. Das ist gewollt: der Vorab-Kanal liegt dann nicht
# hinter dem stabilen zurueck, und niemand faellt beim Umschalten auf
# eine aeltere Fassung.
#
# Bei einem echten Vorab-Stand hier - und NUR hier - erhoehen und den Tag
# entsprechend benennen (z. B. v1.4.0-beta1).

VERSION=1.4.7
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/archive/refs/tags/v1.4.7.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/releases/tag/v1.4.7
