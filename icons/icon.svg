<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Calendar Main Body -->
    <rect x="176" y="80" width="160" height="205" rx="16" fill="#ffffff" />

    <!-- Calendar Header Bar Cutout -->
    <path d="M 176 96 C 176 87 183 80 192 80 L 320 80 C 329 80 336 87 336 96 L 336 125 L 176 125 Z" fill="#6dac20" />

    <!-- Ring Binders at Top -->
    <rect x="206" y="68" width="12" height="22" rx="6" fill="#ffffff" />
    <rect x="250" y="68" width="12" height="22" rx="6" fill="#ffffff" />
    <rect x="294" y="68" width="12" height="22" rx="6" fill="#ffffff" />

    <!-- Trash Bin Symbol Cutout inside Calendar Body -->
    <!-- Lid Handle -->
    <rect x="241" y="138" width="30" height="7" rx="3" fill="#6dac20" />
    <!-- Lid -->
    <rect x="216" y="147" width="80" height="12" rx="4" fill="#6dac20" />
    <!-- Bin Main Body -->
    <path d="M 224 164 L 230 252 C 231 259 237 265 245 265 L 267 265 C 275 265 281 259 282 252 L 288 164 Z" fill="#6dac20" />
    <!-- Vertical Ribs in Bin (White lines) -->
    <rect x="238" y="175" width="6" height="72" rx="3" fill="#ffffff" />
    <rect x="253" y="175" width="6" height="72" rx="3" fill="#ffffff" />
    <rect x="268" y="175" width="6" height="72" rx="3" fill="#ffffff" />

    <!-- Left Symbol: Clock / Termine -->
    <g transform="translate(128, 165)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="5" />
      <polyline points="0,-12 0,0 8,6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right Symbol: Reminder Bell -->
    <g transform="translate(384, 165)">
      <path d="M -12 10 C -12 2 -8 -14 0 -14 C 8 -14 12 2 12 10 L 16 14 L -16 14 Z" fill="#ffffff" />
      <circle cx="0" cy="18" r="4" fill="#ffffff" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">ABFUHRKALENDER</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
