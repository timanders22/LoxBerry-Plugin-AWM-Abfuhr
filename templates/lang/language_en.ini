BAUSTEINE_VORTEXT = "Three pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. If you only want to know whether everything runs and when the next collection is, take over the first one alone; each further page stands on its own (no connection crosses a page boundary). The tables only show the bins your calendar 1 knows – if one is missing, the numbers move up (the sample project shows all eight)."
BS1_KOPF = "Abfuhrkalender – is the plugin running? Calendar valid, end of calendar, next collection"
BS1_S1 = "In the plugin tab “Settings” under “Data sources” enter the iCal address of your waste company (or hand over the .ics file under “Upload a calendar file”), save and “Download now”. Tab “MQTT”: “Activate MQTT” ticked (on by default) and, for the commands no. 19 and on page 3, tick “Accept commands via MQTT” and save. Tab “Loxone integration”, step 2: with gateway V2 tick the data points of the tick list (with V1 there is nothing to enter)."
BS1_S2 = "Create the inputs from the name table in step 3: one Virtual Input per value (Periphery → Virtual Inputs → Virtual Input, do not activate “Use as digital input”), a Virtual Text Input for texts, name exactly like this. If you copy the page from the sample project, you get them with it. The commands to the plugin hang on the shared output “LoxBerry MQTT-Gateway” (address /dev/udp/loxberry/11884); if you do not have it yet, import the “Template: MQTT commands” (Periphery → Virtual Outputs → Import template) and take its commands."
BS1_S3 = "Create the page “Abfuhrkalender”. Drag the eight inputs no. 1 to 8 onto the page, plus a constant with the value 1 (no. 9) and the command no. 19 (“Abfuhrkalender: Kalender-Link erneuern”, publish awm/befehl/erneuern 1) at the output “LoxBerry MQTT-Gateway”."
BS1_S4 = "Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (Abfuhr)” and “Meldung Kalender läuft aus (Abfuhr)”, texts as in the list, drag them onto the page. Each gets exactly one connection (from no. 13 and from no. 5). Create the virtual input “Taste Kalender-Link erneuern (Abfuhr)” as a push button (no. 18). Create the two virtual text inputs no. 20 and no. 21 by hand (Periphery → Virtual Inputs → Virtual Text Input), names exactly like this, “Use in User Interface” on."
BS1_S5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom; the OR has two inputs. At the Value Validator no. 10 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0 and the fault message never triggers). Status “Zustand (Abfuhr)”: click “+” four times beforehand (V5 to V8); enter the rows in the given order, the one without condition last."
BS1_S6 = "Save and transfer. Check: awm_status_zaehler counts on every minute; “Zustand (Abfuhr)” shows “running – calendar file … h old”, “Nächste Abholung (Abfuhr)” the ready-made sentence of the plugin."
BS1_H1 = "The fault message only comes after 10 minutes; “Lebenszeichen fehlt” (LoxBerry off, minute run or MQTT gateway stopped) after 15 minutes at the earliest. If any of them stops, all inputs keep their last value – only the stopped counter awm_status_zaehler at no. 10 gives it away."
BS1_H2 = "A failed fetch (awm_abruf = 0) is no alarm: the stored dates remain valid, the status says so. If you want to know early that the server of the waste company is on strike, connect a NOT at awm_abruf via a Switch-On Delay of one day to a notification of your own."
BS1_H3 = "On no. 16: the message comes once when the value changes – and again after every transfer as long as awm_warnung is set."
BS1_H4 = "Postponements because of public holidays are already in the calendar of the waste company (awm_hinweis_da and the text awm_hinweis show the notice) – do not rebuild anything with the operating mode “Feiertag”."
BS1_H5 = "Commands via MQTT need no token: the plugin only accepts them with the tick “Accept commands via MQTT” (off by default), the same command with the same value at most once per minute. The acknowledgement is shown in the plugin tab Test, not in Loxone; the effect shows in the values (e.g. awm_ptest, awm_ack)."
BS1_H6 = "Second calendar (e.g. holiday home): in the tab “Settings” under “Bin mapping” choose the calendar, then fetch the template here (the commands are called awm_2_…, the topics awm/2/…) and copy the pages; announcement and renewal for it send publish awm/befehl/2/ansage 1 or awm/befehl/2/erneuern 1 (test push and acknowledgement apply to all calendars). Lead its fault via a further OR (two inputs) before no. 13 – never two sources directly into one notification."
BS1_H7 = "Deliberately not in the sample, but in the template: awm_zeit_… (per bin), awm_zeit_next and awm_letzter – Loxone time (seconds since 01.01.2009) for a date format of your own; awm_letzter is -1 without calendar data and 0 for a calendar without end."
BS2_KOPF = "Abfuhrkalender Tonnen – all eight kinds of bin: tomorrow, today, days until collection"
BS2_S1 = "The inputs from the name table (page “Abfuhrkalender”, step 2) are enough – each bin has its three names there."
BS2_S2 = "Create the page “Abfuhrkalender Tonnen”. For each bin drag the three commands tomorrow, today and days (e.g. awm_rest_morgen, awm_rest_heute, awm_tage_rest) onto the page and place a status next to them (block search, key F5); enter the rows as in the list, the one without condition last."
BS2_S3 = "Save and transfer. Check: the status of the bin that comes next shows the same days as the head of the plugin."
BS2_H1 = "Bins your calendar does not know are missing in your template and in the table above – the sample project shows all eight. Glass, bulky waste, garden waste and hazardous waste are only recognised by the plugin after a mapping (tab “Settings”, “Bin mapping”) or via your own dates."
BS2_H2 = "Until the first value after the transfer the statuses show “no date in the next 35 days” (the day commands start with -1). Via MQTT the values come with every change and in the full set after 30 minutes at the latest."
BS2_H3 = "The plugin counts the days within the preview window (tab “Settings”, 35 days by default); if you change it, adjust the last status row."
BS3_KOPF = "Abfuhrkalender Erinnerung und Ansage – switching signals, evening push, acknowledgement, test push and announcement"
BS3_S1 = "In the plugin tab “Settings”, section “Notifications”: check “Push message active”, “Announcement active” and “Reminder time the evening before” (18:00 by default); section “Speech output”: choose the speaker; section “Quiet times” as you like. Tab “MQTT”: “Accept commands via MQTT” ticked."
BS3_S2 = "Create the page “Abfuhrkalender Erinnerung und Ansage”. Drag the inputs of the list (the tomorrow values, awm_tage_next and awm_ok once more), from the output “LoxBerry MQTT-Gateway” the three commands “Abfuhrkalender: Tonne draußen quittieren”, “Abfuhrkalender: Test-Push auslösen” and “Abfuhrkalender: Ansage jetzt sprechen”. Create the two virtual text inputs no. 41 and no. 42 by hand (Periphery → Virtual Inputs → Virtual Text Input), names exactly like this, “Use in User Interface” on."
BS3_S3 = "Create three virtual inputs as push buttons (“Taste Tonne steht draußen (Abfuhr)”, “Taste Test-Push (Abfuhr)”, “Taste Abfuhr-Ansage (Abfuhr)”) and one as a switch (“Niemand zu Hause (eigene Quelle)” – if you have your own presence, take its output). Create four notifications (Periphery → Messages → Notification): “Meldung Tonne rausstellen (Abfuhr)”, “Meldung Test-Push (Abfuhr)”, “Meldung Tonne noch nicht draußen (Abfuhr)” and “Meldung Tonne reinholen (Abfuhr)”, texts as in the list; each gets exactly one connection."
BS3_S4 = "Place the remaining blocks via the block search (key F5) – three formulas, one OR, seven ANDs, two Pulse at, two statuses –, parameters as in the list, connect from top to bottom; every AND and OR has two inputs. At the AND no. 20 and at the AND no. 29 invert input I2: click on the input point, afterwards the input shows a small circle. Status “Abfuhr heute und morgen (Abfuhr)” and “Meldewege (Abfuhr)”: click “+” once beforehand (V5)."
BS3_S5 = "Save and transfer. Check: press “Taste Test-Push (Abfuhr)” – right afterwards “Meldung Test-Push (Abfuhr)” arrives on the phone; the plugin tab Test shows the acknowledgement “angenommen”."
BS3_H1 = "“Morgen Abfuhr (Abfuhr)” (no. 11) and “Heute Abfuhr (Abfuhr)” (no. 14) are ready-made switching signals for your own logic; “Tonne noch nicht draußen (Abfuhr)” (no. 20) switches e.g. a reminder light until the button is pressed."
BS3_H2 = "Digital values go with their output Q directly to AND and notification – NO threshold switch in between; it would give a short pulse at every value sent again and thus a message."
BS3_H3 = "The plugin speaks the evening announcement itself via the shared voice output – no block is needed for it. The “Taste Abfuhr-Ansage (Abfuhr)” speaks at once, also during the quiet time of the plugin, but not while “Niemand zu Hause” is on. With the output type “Original Audio Server” the plugin does not speak; the sample has no path for that."
BS3_H4 = "Acknowledging the evening before applies until the collection morning: the second announcement on the collection morning (tab “Settings”, “Second announcement on collection morning”, off by default) is then skipped. Afterwards awm_ack is 0 again – for the next collection you acknowledge anew."
BS3_H5 = "The push message cannot say which bin – that is shown in the app in the status “Abfuhr heute und morgen (Abfuhr)” (ready-made sentences awm_text_morgen and awm_text_heute) and on the page “Abfuhrkalender Tonnen”."
BS3_H6 = "“Meldung Tonne rausstellen” and “Meldung Test-Push” hang on the signal without delay: after every transfer they report again as long as it is set. awm_ptest stays on 1 for 5 minutes; the plugin sends it right after the command. If the test message does not come, first look at the acknowledgement in the plugin tab Test."
Z1_01 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_ok | 1 = calendar data available and valid; 0 = no calendar set up, no dates, data older than three times the fetch interval (42 days by default) or the fetch of a newly entered address failed (further instance on page “Abfuhrkalender Erinnerung und Ansage”); version 2: tick and “Noncached” | —"
Z1_02 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_status_zaehler | sign of life 0 to 999, counts up by one at every minute run (comes every minute, never retained) | —"
Z1_03 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_abruf | 1 = the last fetch from the waste company succeeded; 0 = failed – the stored dates remain valid (early warning, no alarm) | —"
Z1_04 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_alter | age of the calendar file in hours; -1 = no file | —"
Z1_05 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_warnung | 1 = the calendar delivers no more dates in less than 30 days (turn of the year) | —"
Z1_06 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_luecke | days until the next collection date the waste company has cancelled without replacement; 0 = none | —"
Z1_07 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_hinweis_da | 1 = the waste company announces a postponement within the next 14 days (e.g. because of a public holiday) | —"
Z1_08 = "Virtual input (name as assigned by the MQTT gateway, plugin Abfuhrkalender (AWM & iCal)) | awm_tage_next | days until the next collection of any bin; 0 = today, -1 = none in the next 35 days (further instance on page “Abfuhrkalender Erinnerung und Ansage”) | —"
Z1_09 = "Constant | Konstante 1 | value 1 | —"
Z1_10 = "Value Validator | Lebenszeichen fehlt (Abfuhr) | Tmc 900 s (15 minute runs; a single lost message of the gateway reports nothing), Min 0, Max 999 – if the LoxBerry, the minute run or the MQTT gateway stops, the counter stands still; remove the tick at ‘En’ in the properties window | V = #2, En = #9"
Z1_11 = "NOT | Keine frischen Daten (Abfuhr) | — (no valid calendar data) | I = #1"
Z1_12 = "OR | Störung (Abfuhr) | — (no fresh data or sign of life missing) | I1 = #11, I2 = output E of #10"
Z1_13 = "Switch-On Delay | Störung bestätigt (Abfuhr) | 600 s (a restart and a single gap report nothing) | Input = #12"
Z1_14 = "Notification | Meldung Plugin gestört (Abfuhr) | Text: Abfuhrkalender – no valid dates for 10 minutes: LoxBerry, MQTT gateway or plugin does not answer, or the calendar is missing or out of date. Reminders will not come then. Read the status “Zustand (Abfuhr)” in the app | Input = #13"
Z1_15 = "Status | Zustand (Abfuhr) | rows: V1 = 1 “sign of life missing for at least 15 minutes – LoxBerry, MQTT gateway or the minute run of the plugin has stopped; in the plugin tab MQTT check that ‘Activate MQTT’ is ticked and the gateway is set to autostart, then tab ‘Loxone integration’, step 2 (subscription or ticks)”; V2 = 0 and V4 < 0 “no calendar yet – in the plugin tab Settings under ‘Data sources’ enter the iCal address or upload the calendar file, then ‘Download now’”; V2 = 0 “no valid dates – calendar too old (<v4> h) or the fetch of a new address failed; in the plugin tab Settings ‘Download now’, then look at tab Test ‘All dates (debug)’”; V5 = 1 “calendar ends in less than 30 days – the year renewal runs by itself; if it fails, get a new iCal link from the waste company”; V3 = 0 “last fetch failed – the stored dates remain valid (file <v4> h old); the reason is shown in the plugin tab Test ‘All dates (debug)’”; V6 > 0 “in <v6> days a collection is cancelled without replacement – look at the plugin tab Test ‘All dates (debug)’”; V7 = 1 “the waste company announces a postponement: <v8>”; without condition “running – calendar file <v4> h old”; visualisation ON | V1 = output E of #10, V2 = #1, V3 = #3, V4 = #4, V5 = #5, V6 = #6, V7 = #7, V8 = #21"
Z1_16 = "Notification | Meldung Kalender läuft aus (Abfuhr) | Text: Abfuhrkalender – the calendar delivers no more dates in less than 30 days. The plugin tries the year renewal itself; if it fails, get the new iCal link from the waste company and enter it in the plugin tab Settings under “Data sources” | Input = #5"
Z1_17 = "Status | Nächste Abholung (Abfuhr) | rows: V2 = 0 “no valid dates – read status ‘Zustand (Abfuhr)’”; V1 = 0 “collection today – which bin is shown on the page ‘Abfuhrkalender Tonnen’”; V1 = 1 “collection tomorrow – put the bin out this evening: <v3>”; V1 >= 2 “<v3>”; without condition “no collection known in the next 35 days”; visualisation ON | V1 = #8, V2 = #1, V3 = #20"
Z1_18 = "Virtual input (push button) | Taste Kalender-Link erneuern (Abfuhr) | in the app; looks for the iCal link of the following year at once (otherwise by itself from 30 days before the end of the calendar, once a day) | —"
Z1_19 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | Abfuhrkalender: Kalender-Link erneuern | command on ON: publish awm/befehl/erneuern 1; tries a fresh calendar link at once; the plugin accepts at most one call per hour; only a link with at least one future date is taken over; works only with the tick “Accept commands via MQTT” in the plugin (tab MQTT) | Input = #18"
