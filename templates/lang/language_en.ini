H_TITEL = "Assign bins"
ERKLAERUNG = "There is no standard for naming a collection date. The same residual waste is called <code>Restm&uuml;lltonne</code>, <code>RM 14t&auml;g.</code> or <code>Graue Tonne - Tour B</code> depending on the provider. Below are the names that <b>actually occur in your calendar file</b> - pick the matching bin for each row. Whoever assigns nothing gets the built-in detection as before; for Munich that is exactly right."
KEINE_TITEL = "No calendar file has been fetched yet - or it contains no dates. Please enter and save the calendar URL on the &ldquo;Settings&rdquo; tab, then click <i>Fetch now</i> here."
