W_SOCKETS = "The PHP extension “sockets” is missing. Without it the gateway cannot be reached over UDP — MQTT stays ineffective."

[LOX]
H_TITEL = "Loxone integration — step by step"
S1 = "Step 1: choose the path"
S1_TEXT = "HTTP is the path of the sample project: a “Virtual HTTP input” polls the Loxone line every 300 seconds, the template creates all commands at once (step 3 and “Create everything at once” below). MQTT is an alternative with the same values: one subscription, and all values arrive, plus the notice text and ready-made sentences. MQTT is off in the plugin by default (tab MQTT). Both paths calculate from the same place."
S2 = "Step 2: the subscription in the MQTT gateway (only for the path via MQTT)"
S2_TEXT = "The topic group of this plugin is:"
S3 = "Step 3: create virtual inputs (path of the sample project)"
S3_TEXT = "Create a “Virtual HTTP input” and inside it one “Virtual HTTP input command” per value. The template further down is more convenient — it creates them all at once."
S3_BEFEHLE = "The commands in detail. The search text sits between <code>\i</code> and <code>\i</code>, <code>\v</code> takes the number after it:"
S3_SEMIKOLON = "The search text carries the semicolon. That is not cosmetic: the field name <code>WERT=</code> also occurs inside <code>HWERT=</code> and <code>TWERT=</code>, and Loxone takes the first match. So far this only worked because the short names come first in the line. With the leading semicolon every search text is unambiguous."
S3_KOMPAT = "Existing inputs without the semicolon keep working unchanged — the line still starts with <code>MUELL;REST=…</code> and is therefore 1:1 compatible with the classic muell.php."
S4 = "Step 4: sending commands (virtual output)"
S4_TEXT = "These addresses trigger something and therefore require the action token. The template further down creates them ready to use."
T_ZWECK = "Purpose"
T_ADRESSE = "Address"
A_SAY = "Speak the announcement now"
A_PTEST = "Trigger a test push message"
A_ACK = "Acknowledge “bin is outside”"
A_RENEW = "Try the year renewal now"
A_SELFTEST = "only check whether the token is correct"
S4_TOKEN = "If a new token is created, the old addresses stop working. Import the virtual output template again in that case."
S5 = "Step 5: failure detection"
S5_TEXT = "Virtual inputs keep their last value. If the plugin goes silent, everything looks normal in the app. Two values make a failure visible: <code>ZAEHLER</code>, the run counter of the minute run (0 to 999, changes with every poll at a polling time of 300 seconds; if it stands still, LoxBerry or plugin have stopped – at a Value Validator with Tmc 900 seconds), and <code>OK</code> (0 = no valid calendar data; <code>OK</code> drops to 0 as soon as the data of a calendar with an address are older than three times the download interval, 1008 hours for 14 days; uploaded calendars are exempt). For troubleshooting in addition: <code>FETCH</code> (last download successful), <code>AGE</code> (age of the calendar file in hours) and <code>LETZTER</code> (last date in the calendar). The page “Abfuhrkalender” in step 6 combines ZAEHLER and OK into one fault message."
S6 = "Step 6: The blocks, three pages to rebuild"
T_NAME = "Name"
T_PARAM = "Parameters"
T_EINGAENGE = "Connect inputs to"
S7 = "Step 7: cross-check"
S7_TEXT = "In the “Test” tab click “Fetch Loxone line” — that is exactly what the Miniserver receives. Then look at the values of the virtual inputs in Loxone Config. If everything shows 0, the subscription in the MQTT gateway is usually missing (step 2), or the address in the virtual input points at the wrong machine."
