M_UNGEPRUEFT = "%d retained topics under %s/ deleted with an empty message. The broker could not be asked whether nothing is left."
M_KEIN_EINGANG = "The UDP input of the MQTT gateway was not reachable – nothing was cleared under %s/."
M_KEIN_PORT = "general.json has no UDP input of the MQTT gateway – nothing was cleared under %s/."
M_GEMERKT = "The prefix has been noted; uninstalling clears it once more."
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> the plugin brings the file <span class='sm-mono'>mqtt_subscriptions.cfg</span> with the topic group, and the gateway reads it by itself; if it is missing, the line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
H_ABO = "The subscription in the MQTT gateway"
H_PRAEFIX = "The LoxBerry MQTT Gateway is used. Publishing happens on every change, the full set every 30 minutes. The heartbeat (<code>status/ok</code>, <code>status/ts</code>, <code>status/zaehler</code>) goes out on every minute run."
H_THEMEN = "Published topics"
H_THEMEN_TEXT = "All topics carry the prefix above. They come from the same calculation as the Loxone line — the two paths cannot drift apart."
H_TITEL = "MQTT"
H_ZWEITER = "The second and every further calendar publishes under <code>%s/2/...</code>, <code>%s/3/...</code> and so on."
L_AN = "Activate MQTT"
L_PRAEFIX = "Topic prefix"
T_ABO = "The topic group of this plugin is:"
T_ABO_WARN = "Without this entry nothing arrives at the Miniserver. The line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
T_BEDEUTUNG = "Meaning"
T_THEMA = "Topic"
T_RETAIN = "Retained"
RETAIN_JA = "yes"
RETAIN_NEIN = "no"
H_RETAIN = "Only topics that stay true until someone changes them are retained: the permissions for announcement and push message and the last date in the calendar. Everything that becomes wrong merely because time passes (tomorrow, today, in N days, next pickup, notice, windows, ready-made sentences) and every statement of the plugin about itself (ok, abruf, age, heartbeat) is sent non-retained — after a restart of broker or gateway these values are missing until the next full set (at the latest after 30 minutes) instead of standing there outdated."
W_AUTOSTART = "Autostart of the MQTT gateway is switched off. After a LoxBerry restart nothing will arrive any more."
W_SOCKETS = "The PHP extension “sockets” is missing. Without it the gateway cannot be reached over UDP — MQTT stays ineffective."
L_HAUS = "Give collection days to other plugins (haus/abfuhr/…)"
H_HAUS = "Off by default, works only with “Activate MQTT”. Every minute the plugin then places the collection days of all calendars with valid data under <code>haus/abfuhr/heute</code>, <code>…/morgen</code> (keys such as <code>rest,papier</code>, <code>keine</code>, no statement <code>-</code>), <code>…/heute_satz</code>, <code>…/morgen_satz</code>, <code>…/quittiert</code> (1/0/-1) and <code>…/tage</code> (-1 no statement), retained, plus the sign of life <code>haus/abfuhr/zaehler</code> – directly at the broker, not via the gateway. Only one waste calendar in the house is the provider. Reads it today: the Abfahrts-Assistent (sentence on the collection day, off by default there). When switched off and on uninstall the plugin clears the topics, checking back with the broker."
H_HAUS_GATEWAY = "The topics <code>haus/…</code> go from plugin to plugin, not to the Miniserver. Anyone who wants to see them in Loxone ticks them in the MQTT gateway."

[LOX]
H_TITEL = "Loxone integration — step by step"
S1 = "Step 1: switch on MQTT"
S1_TEXT = "MQTT is the path of the sample project: the plugin publishes all values, the MQTT gateway of the LoxBerry passes them on to the Miniserver. MQTT is on in the plugin by default (an installation from a version before 1.4.25 keeps its setting) – check the tick “Activate MQTT” in the tab MQTT. The path via HTTP (Virtual HTTP input, polled every 300 seconds) stays for existing installations (below, “Existing installations: path via HTTP”); new installations take MQTT. Both paths calculate from the same place."
S2 = "Step 2: the MQTT gateway"
S2_TEXT = "The topic group of this plugin is:"
S3 = "Step 3: create the inputs (name table)"
S3_TEXT = "For the values via the MQTT gateway there is no template to import: in Loxone Config create one Virtual Input per value (Periphery → Virtual Inputs → Virtual Input), and a Virtual Text Input for the four texts. The name must be exactly as in the table – the gateway sends the value under this name (copy button next to it). The table follows your calendar 1: bins it does not know are missing."
S3_BEFEHLE = "The commands in detail. The search text sits between <code>\i</code> and <code>\i</code>, <code>\v</code> takes the number after it:"
S3_SEMIKOLON = "The search text carries the semicolon. That is not cosmetic: the field name <code>WERT=</code> also occurs inside <code>HWERT=</code> and <code>TWERT=</code>, and Loxone takes the first match. So far this only worked because the short names come first in the line. With the leading semicolon every search text is unambiguous."
S3_KOMPAT = "Existing inputs without the semicolon keep working unchanged — the line still starts with <code>MUELL;REST=…</code> and is therefore 1:1 compatible with the classic muell.php."
S4 = "Step 4: commands via MQTT"
S4_TEXT = "Loxone sends commands via a Virtual Output to the UDP input of the MQTT gateway; the plugin only accepts them with the tick “Accept commands via MQTT” in the tab MQTT (off by default). With gateway V1 and V2 there is nothing to enter or tick for this. In the sample project the commands hang on the shared output “LoxBerry MQTT-Gateway”; the “Template: MQTT commands” below creates an output of its own with the same commands."
T_ZWECK = "Purpose"
T_ADRESSE = "Address"
A_SAY = "Speak the announcement now"
A_PTEST = "Trigger a test push message"
A_ACK = "Acknowledge “bin is outside”"
A_RENEW = "Try the year renewal now"
A_SELFTEST = "only check whether the token is correct"
S4_TOKEN = "If a new token is created, the old addresses stop working. Import the virtual output template again in that case."
S5 = "Step 5: failure detection"
S5_TEXT = "Virtual inputs keep their last value. If the plugin or the MQTT gateway goes silent, everything looks normal in the app. The sign of life <code>%1$s</code> counts up by one at every minute run (0 to 999) – at a Value Validator with Tmc 900 seconds (15 runs; the UDP input of the gateway loses single messages under load, a single gap reports nothing). In addition <code>%2$s</code> (0 = no valid calendar data; 0 as soon as the data of a calendar with an address are older than three times the download interval, 1008 hours for 14 days; uploaded calendars are exempt; goes out at every minute run). For troubleshooting: <code>%3$s</code> (last download successful), <code>%4$s</code> (age of the calendar file in hours) and <code>%5$s</code> (last date, -1 = no calendar data). The page “Abfuhrkalender” in step 6 combines sign of life and OK into one fault message. Via HTTP the values are called ZAEHLER, OK, FETCH, AGE and LETZTER."
S6 = "Step 6: The blocks, three pages to rebuild"
