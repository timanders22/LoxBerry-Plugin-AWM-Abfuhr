[QUELLEN]
H_WEITERE = "Setting up other waste companies"
EINLEITUNG = "The plugin reads any iCal/ICS export, not just the AWM one. Always start at <b>your own waste company&apos;s collection calendar page</b> - not at the site of the software vendor behind it: you cannot enter an address there. Enter your address at the waste company, right-click the export link, copy it and paste it above. Then map the labels that actually occur in the file on the &ldquo;Bins&rdquo; tab. The systems below sit behind many German collection calendars - the notes help you recognise them."
SONST = "A different waste company? Look for <b>iCal</b>, <b>ICS</b> or <b>subscribe to calendar</b> on their collection calendar page. Nearly every German waste company offers such an export - the plugin does not need a dedicated interface."
HINWEIS_JAHR = "If the link contains a year, the plugin tries to renew it at the turn of the year on its own. If that fails it says so in the log - then fetch a fresh link from your waste company once."
ABFALLIO = "Recognisable by an export link pointing to <span class='sm-mono'>api.abfall.io</span>. Enter your address, select the waste types, then <b>right-click</b> the <b>ICS</b> button and copy the link address. The link contains a time window such as <span class='sm-mono'>timeperiod=20260101-20261231</span> - the plugin advances it at the turn of the year by itself."
JUMOMIND = "Recognisable by the web module at <span class='sm-mono'>...jumomind.com/webmodul/&lt;municipality&gt;/</span>. The bare address <b>without</b> a municipality is blocked and returns <i>Forbidden</i> - your waste company links the entry point on its own site, or the MyM&uuml;ll app takes you there. Select town, street and house number, then right-click the <b>iCal</b> download and copy the link."
ATURIS = "The AbfallKalenderSystem by ATURIS, used by many municipal utilities. In your waste company&apos;s collection calendar select town, street and house number, then right-click the <b>ICS</b> download button and copy the link."

[HINWEIS]
LABEL = "Keywords for holiday rescheduling"
ERKLAERUNG = "Comma separated. If one of these words appears in the title or description of a single appointment within the next 14 days, the plugin shows it as a notice and publishes it via MQTT. AWM Munich writes <b>Achtung</b> – that is why the word comes first and must not be removed. Other waste companies word it differently; an empty field restores the default list."
