; Waste collection calendar AWM Munich - English texts
;
; English is the FALLBACK for every language: a user who set a third
; language understands English rather than German. This file must therefore
; always be complete.
;
; RULE FOR EVERY VALUE: a value is enclosed in "...". A second " inside ends
; it early, silently. Use single quotes for markup attributes and
; typographic quotation marks.
;
; NOTE: MQTT topic names and Loxone search patterns are NEVER translated.
; They are what the plugin actually publishes. Up to 1.3.8 this file
; translated them - an English user subscribed to topics that do not exist.

