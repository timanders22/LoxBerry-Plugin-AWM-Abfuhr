H_VORLAGE_TEXT = "The templates create the blocks ready to use. In Loxone Config: right-click the Miniserver → “Import template”. Loxone always creates NEW and overwrites nothing — importing twice gives duplicate blocks. The input template only contains the bins that actually occur in your calendar."
TOKEN_WARN = "A new token invalidates all previous addresses in Loxone. Import the virtual output template again afterwards."
BS_SP_NR = "#"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
BAUSTEINE_VORTEXT = "Three pages from the LoxBerry plugins sample project, built and connected there in Loxone Config. If you only want to know whether everything runs and when the next collection is, take over the first one alone; each further page stands on its own (no connection crosses a page boundary). The tables only show the bins your calendar 1 knows – if one is missing, the numbers move up (the sample project shows all eight)."
BS1_KOPF = "Abfuhrkalender – is the plugin running? Calendar valid, end of calendar, next collection"
BS1_S1 = "In the plugin tab “Settings” under “Data sources” enter the iCal address of your waste company (or hand over the .ics file under “Upload a calendar file”), save and “Download now”. Under “Bin mapping” check that all bins are recognised. Tab “Test” → “Fetch Loxone line”: a line arrives that starts with MUELL;REST=."
BS1_S2 = "Further down in this tab under “Create everything at once” download the “Template: virtual inputs” and the “Template: virtual output” and import them in Loxone Config: Periphery → Virtual Inputs → Import template, likewise Periphery → Virtual Outputs → Import template. Import each only ONCE (twice gives duplicate blocks). The input template only contains the bins that occur in your calendar. The two containers “Abfuhrkalender (AWM & iCal) …” and “Abfuhrkalender (AWM & iCal) steuern” serve all three pages."
BS1_S3 = "Create the page “Abfuhrkalender”. Drag the eight commands no. 1 to 8 from the container “Abfuhrkalender (AWM & iCal) …” onto the page, plus a constant with the value 1 (no. 9) and from “Abfuhrkalender (AWM & iCal) steuern” the command “Jahres-Erneuerung” (no. 19)."
BS1_S4 = "Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (Abfuhr)” and “Meldung Kalender läuft aus (Abfuhr)”, texts as in the list, drag them onto the page. Each gets exactly one connection (from no. 13 and from no. 5). Create the virtual input “Taste Kalender-Link erneuern (Abfuhr)” as a push button (no. 18)."
BS1_S5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom; the OR has two inputs. At the Value Validator no. 10 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0 and the fault message never triggers). Status “Zustand (Abfuhr)”: click “+” three times beforehand (V5 to V7); enter the rows in the given order, the one without condition last."
BS1_S6 = "Save and transfer. Check: “Zustand (Abfuhr)” shows “running – calendar file … h old”, “Nächste Abholung (Abfuhr)” the same days as the head of the plugin; MUELL_ZAEHLER counts on at every poll (every 5 minutes)."
BS1_H1 = "The fault message only comes after 10 minutes; “Lebenszeichen fehlt” (LoxBerry off, minute run stopped) after 15 minutes at the earliest. If the LoxBerry stops, all inputs keep their last value – only the stopped run counter at no. 10 gives it away."
BS1_H2 = "A failed fetch (MUELL_FETCH = 0) is no alarm: the stored dates remain valid, the status says so. If you want to know early that the server of the waste company is on strike, connect a NOT at MUELL_FETCH via a Switch-On Delay of one day to a notification of your own."
BS1_H3 = "On no. 16: the message comes once when the value changes – and again after every transfer as long as MUELL_WARN is set."
BS1_H4 = "Postponements because of public holidays are already in the calendar of the waste company (MUELL_HINW shows the notice) – do not rebuild anything with the operating mode “Feiertag”."
BS1_H5 = "After “Create a new action token” fetch and import the template for the virtual output again (or replace the token in the four commands)."
BS1_H6 = "Second calendar (e.g. holiday home): in the tab “Settings” under “Bin mapping” choose the calendar, then fetch the templates here (the commands are called MUELL_…_2) and copy the pages; lead its fault via a further OR (two inputs) before no. 13 – never two sources directly into one notification."
BS1_H7 = "Deliberately not in the sample: MUELL_S… (per bin), MUELL_SNEXT and MUELL_LETZTER – Loxone time (seconds since 01.01.2009) for a date format of your own –, the date as YYYYMMDD (only in the Loxone line and over MQTT) and the ready-made sentences (only over MQTT or ?text=1)."
BS2_KOPF = "Abfuhrkalender Tonnen – all eight kinds of bin: tomorrow, today, days until collection"
BS2_S1 = "The containers from page “Abfuhrkalender”, step 2 are enough – do not import anything again."
BS2_S2 = "Create the page “Abfuhrkalender Tonnen”. For each bin drag the three commands tomorrow, today and days (e.g. MUELL_REST, MUELL_HREST, MUELL_TREST) from the container “Abfuhrkalender (AWM & iCal) …” and place a status next to them (block search, key F5); enter the rows as in the list, the one without condition last."
BS2_S3 = "Save and transfer. Check: the status of the bin that comes next shows the same days as the head of the plugin."
BS2_H1 = "Bins your calendar does not know are missing in your template and in the table above – the sample project shows all eight. Glass, bulky waste, garden waste and hazardous waste are only recognised by the plugin after a mapping (tab “Settings”, “Bin mapping”) or via your own dates."
BS2_H2 = "Until the first poll after the transfer the statuses show “no date in the next 35 days” (the day commands start with -1; with a template from a version before 1.4.24 briefly “in 0 days”)."
BS2_H3 = "The plugin counts the days within the preview window (tab “Settings”, 35 days by default); if you change it, adjust the last status row."
BS3_KOPF = "Abfuhrkalender Erinnerung und Ansage – switching signals, evening push, acknowledgement, test push and announcement"
BS3_S1 = "In the plugin tab “Settings”, section “Notifications”: check “Push message active”, “Announcement active” and “Reminder time the evening before” (18:00 by default); section “Speech output”: choose the speaker; section “Quiet times” as you like."
BS3_S2 = "Create the page “Abfuhrkalender Erinnerung und Ansage”. Drag the commands of the list from the container “Abfuhrkalender (AWM & iCal) …” (the tomorrow commands, MUELL_TNEXT and MUELL_OK once more), from “Abfuhrkalender (AWM & iCal) steuern” the three commands “Quittierung Tonne draußen”, “Test-Pushnachricht” and “Ansage jetzt”."
BS3_S3 = "Create three virtual inputs as push buttons (“Taste Tonne steht draußen (Abfuhr)”, “Taste Test-Push (Abfuhr)”, “Taste Abfuhr-Ansage (Abfuhr)”) and one as a switch (“Niemand zu Hause (eigene Quelle)” – if you have your own presence, take its output). Create two notifications (Periphery → Messages → Notification): “Meldung Tonne rausstellen (Abfuhr)” and “Meldung Test-Push (Abfuhr)”, texts as in the list; each gets exactly one connection."
BS3_S4 = "Place the remaining blocks via the block search (key F5) – three formulas, one OR, three ANDs, two statuses –, parameters as in the list, connect from top to bottom; every AND and OR has two inputs. At the AND no. 20 and at the AND no. 29 invert input I2: click on the input point, afterwards the input shows a small circle. Status “Meldewege (Abfuhr)”: click “+” once beforehand (V5)."
BS3_S5 = "Save and transfer. Check: press “Taste Test-Push (Abfuhr)” – within 5 minutes “Meldung Test-Push (Abfuhr)” arrives on the phone."
BS3_H1 = "“Morgen Abfuhr (Abfuhr)” (no. 11) and “Heute Abfuhr (Abfuhr)” (no. 14) are ready-made switching signals for your own logic; “Tonne noch nicht draußen (Abfuhr)” (no. 20) switches e.g. a reminder light until the button is pressed."
BS3_H2 = "Digital values go with their output Q directly to AND and notification – NO threshold switch in between; it would give a short pulse at every poll and thus a message every 5 minutes."
BS3_H3 = "The plugin speaks the evening announcement itself via the shared voice output – no block is needed for it. The “Taste Abfuhr-Ansage (Abfuhr)” speaks at once, also during the quiet time of the plugin, but not while “Niemand zu Hause” is on. With the output type “Original Audio Server” the plugin does not speak; the sample has no path for that."
BS3_H4 = "Acknowledging the evening before applies until the collection morning: the second announcement on the collection morning (tab “Settings”, “Second announcement on collection morning”, off by default) is then skipped. Afterwards MUELL_ACK is 0 again – for the next collection you acknowledge anew."
BS3_H5 = "The push message cannot say which bin – that is shown in the app in the status “Abfuhr heute und morgen (Abfuhr)” and on the page “Abfuhrkalender Tonnen”."
BS3_H6 = "“Meldung Tonne rausstellen” and “Meldung Test-Push” hang on the signal without delay: after every transfer they report again as long as it is set. MUELL_PTEST stays on for 5 minutes, as long as the polling time – if the test message does not come, repeat the test once."
Z1_01 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_OK | 1 = calendar data available and valid; 0 = no calendar set up, no dates, data older than three times the fetch interval (42 days by default) or the fetch of a newly entered address failed (further instance on page “Abfuhrkalender Erinnerung und Ansage”) | —"
Z1_02 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_ZAEHLER | run counter 0 to 999, counts up by one every minute – the sign of life; -1 = no run yet | —"
Z1_03 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_FETCH | 1 = the last fetch from the waste company succeeded; 0 = failed – the stored dates remain valid (early warning, no alarm) | —"
Z1_04 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_AGE | age of the calendar file in hours; -1 = no file | —"
Z1_05 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_WARN | 1 = the calendar delivers no more dates in less than 30 days (turn of the year) | —"
Z1_06 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_LUECKE | days until the next collection date the waste company has cancelled without replacement; 0 = none | —"
Z1_07 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_HINW | 1 = the waste company announces a postponement within the next 14 days (e.g. because of a public holiday) | —"
Z1_08 = "Virtual HTTP input command (template “Abfuhrkalender (AWM & iCal) Kalender 1”) | MUELL_TNEXT | days until the next collection of any bin; 0 = today, -1 = none in the next 35 days (further instance on page “Abfuhrkalender Erinnerung und Ansage”) | —"
Z1_09 = "Constant | Konstante 1 | value 1 | —"
Z1_10 = "Value Validator | Lebenszeichen fehlt (Abfuhr) | Tmc 900 s (three times the polling time of 300 s), Min 0, Max 999 – if the LoxBerry or the minute run stops, the counter stands still; -1 (no run yet) lies below Min and also reports; remove the tick at ‘En’ in the properties window | V = #2, En = #9"
Z1_11 = "NOT | Keine frischen Daten (Abfuhr) | — (no valid calendar data) | I = #1"
Z1_12 = "OR | Störung (Abfuhr) | — (no fresh data or sign of life missing) | I1 = #11, I2 = output E of #10"
Z1_13 = "Switch-On Delay | Störung bestätigt (Abfuhr) | 600 s (two polls; a restart and a single failed poll report nothing) | Input = #12"
Z1_14 = "Notification | Meldung Plugin gestört (Abfuhr) | Text: Abfuhrkalender – no valid dates for 10 minutes: LoxBerry or plugin does not answer, or the calendar is missing or out of date. Reminders will not come then. Read the status “Zustand (Abfuhr)” in the app | Input = #13"
Z1_15 = "Status | Zustand (Abfuhr) | rows: V1 = 1 “sign of life missing for at least 15 minutes – LoxBerry or the minute run of the plugin has stopped; open the LoxBerry in the browser, in the plugin tab Test ‘Fetch Loxone line’”; V2 = 0 and V4 < 0 “no calendar yet – in the plugin tab Settings under ‘Data sources’ enter the iCal address or upload the calendar file, then ‘Download now’”; V2 = 0 “no valid dates – calendar too old (<v4> h) or the fetch of a new address failed; in the plugin tab Settings ‘Download now’, then look at tab Test ‘All dates (debug)’”; V5 = 1 “calendar ends in less than 30 days – the year renewal runs by itself; if it fails, get a new iCal link from the waste company”; V3 = 0 “last fetch failed – the stored dates remain valid (file <v4> h old); the reason is shown in the plugin tab Test ‘All dates (debug)’”; V6 > 0 “in <v6> days a collection is cancelled without replacement – look at the plugin tab Test ‘All dates (debug)’”; V7 = 1 “the waste company announces a postponement – the text is shown in the plugin tab Test ‘Ready-made sentences’ (last line)”; without condition “running – calendar file <v4> h old”; visualisation ON | V1 = output E of #10, V2 = #1, V3 = #3, V4 = #4, V5 = #5, V6 = #6, V7 = #7"
Z1_16 = "Notification | Meldung Kalender läuft aus (Abfuhr) | Text: Abfuhrkalender – the calendar delivers no more dates in less than 30 days. The plugin tries the year renewal itself; if it fails, get the new iCal link from the waste company and enter it in the plugin tab Settings under “Data sources” | Input = #5"
Z1_17 = "Status | Nächste Abholung (Abfuhr) | rows: V2 = 0 “no valid dates – read status ‘Zustand (Abfuhr)’”; V1 = 0 “collection today – which bin is shown on the page ‘Abfuhrkalender Tonnen’”; V1 = 1 “collection tomorrow – put the bin out this evening”; V1 >= 2 “next collection in <v1> days”; without condition “no collection known in the next 35 days”; visualisation ON | V1 = #8, V2 = #1"
