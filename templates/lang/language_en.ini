ZU4 = "On #4:"
ZU4_TEXT = "The notification block only sends on an edge from off to on. Never connect several sources directly to its input — merge them through an OR first, otherwise a permanently active source swallows all the others."
ZU9 = "On #9:"
ZU9_TEXT = "The acknowledgement goes back to the plugin. It then skips the second announcement on collection morning — without this block the house speaks even when the bin has long been outside."
ZU12 = "On #12:"
ZU12_TEXT = "<code>FETCH=0</code> means the last download attempt failed. The dates are usually still correct because the stored calendar keeps running — it is an early warning, not an alarm. Set the threshold well above the collection cycle."
ZU13 = "On #13:"
ZU13_TEXT = "<code>TNEXT</code> is the number you want to see in the app. For a date use <code>SNEXT</code>: that is Loxone time (seconds since 01.01.2009) and can be formatted as a date directly."
S7 = "Step 7: cross-check"
S7_TEXT = "In the „Test“ tab click „Fetch Loxone line“ — that is exactly what the Miniserver receives. Then look at the values of the virtual inputs in Loxone Config. If everything shows 0, the subscription in the MQTT gateway is usually missing (step 2), or the address in the virtual input points at the wrong machine."
