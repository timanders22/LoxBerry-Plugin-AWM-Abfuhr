; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is enclosed in double quotation marks and contains none
; itself; markup stays raw, the help is not escaped on output.
;
; English is the FALLBACK for every language, so this file must always be
; complete. Translated by hand from help_de.ini, key for key.

[HILFE]
K01 = "Waste collection calendar AWM Munich"
K02 = "Brings the collection calendar of AWM Munich (the municipal waste service) — or any other iCal/ICS collection calendar with bin names in the event titles — into Loxone: which bin is due <b>tomorrow</b>, which <b>today</b>, and in how many days the next collection comes. Plus an <b>evening announcement</b> (TTS via Music Server/Audioserver), <b>MQTT</b> publishing and <b>JSON</b>."
K03 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, runs on PHP 7.4 and 8.x)."
K04 = "Features"
K05 = "iCal/ICS import by address <b>or as an uploaded file</b>, download interval configurable; the calendar is stored permanently and survives restarts, updates and outages of the waste service's server"
K06 = "Expands <b>recurring events</b> itself: <code>FREQ=DAILY/WEEKLY/MONTHLY/YEARLY</code> with <code>INTERVAL</code>, <code>BYDAY</code>, <code>BYMONTHDAY</code>, <code>BYMONTH</code>, <code>BYSETPOS</code>, <code>WKST</code>, <code>COUNT</code>, <code>UNTIL</code>, <code>EXDATE</code>, <code>RDATE</code> and <code>RECURRENCE-ID</code>. Whatever the plugin can<b>not</b> evaluate, it says so in the <i>Test</i> tab — it does not guess"
K07 = "<b>Eight bin types</b>: residual/household waste, organic, paper, recyclables/yellow bin, glass, bulky waste, garden waste, hazardous waste. All eight arrive through the Loxone line, MQTT, the template and the announcement"
K08 = "<b>Mapping table per calendar</b>: the page shows which labels really occur in the file and what the plugin makes of them — including what an own rule displaces"
K09 = "<b>Your own dates</b> entered by hand (Christmas tree, bulky waste on request)"
K10 = "<b>Loxone text line</b>, 1:1 compatible with the widespread muell.php format (<code>MUELL;REST=..;BIO=..;PAPIER=..;DATUM=..</code>), extended by today flags, day counters, the date per bin, <b>Loxone time</b> for calculations, the next collection of any kind, failure detection and the notification markers"
K11 = "<b>Evening announcement</b> and optionally a <b>second announcement on collection morning</b> (“Is the bin already outside?”), text freely configurable with placeholders"
K12 = "<b>Quiet times</b>: do not speak at night, do not speak while on holiday (the source is the plugin <i>Ferien und Feiertage</i>, if installed), or suspend announcements until a given date"
K13 = "<b>Acknowledgement</b> from Loxone back to the plugin (<code>?ack=1</code>) — the morning announcement is then skipped"
K14 = "<b>MQTT</b> via the LoxBerry MQTT Gateway, on every change and every 30 minutes as a heartbeat. <b>All</b> values of the Loxone line, plus the notice text and three ready-made sentences"
K15 = "<b>Two Loxone templates</b> to import: virtual inputs (only the bins that occur in your own calendar) and a virtual output for the triggering calls including the token"
K16 = "<b>Failure detection</b>: age of the calendar file, success of the last download, last date in the calendar — as separate values for Loxone"
K17 = "<b>Gap detection</b>: if the waste service cancels a date without naming a replacement, this is shown instead of hidden"
K18 = "<b>Warnings in the LoxBerry notification area</b> for an expired calendar, three failed downloads and a failed year renewal"
K19 = "<b>Year renewal</b>: if the calendar runs out of dates in less than 30 days, the plugin tries to obtain a fresh link itself — with dedicated strategies for AWM Munich, Abfallplus/abfall.io, Jumomind/MyMüll and ATURIS"
K20 = "Configuration, log and calendar survive plugin updates and a reinstallation"
K21 = "New in 1.4.7"
K22 = "This version goes back to a line-by-line review with two checking agents. Measurements were taken against the plugin's real parser and against a real AWM export (73 collection days in 2026); the Munich detection has stayed the same line for line."
K23 = "What was silently wrong"
K24 = "<b>The Loxone template swapped eight inputs.</b> <code>MUELL_REST</code> was declared analogue 0–365 with the unit “days” and really carries 0/1; <code>MUELL_TREST</code> was digital 0–1 and carries the day counter. Loxone Config accepts such a file without complaint — the error only shows up in the app. <code>WARN</code> also carried another field's comment."
K25 = "<b><code>EXDATE:a,b,c</code> on one line</b> only let the first exception take effect. The Munich export writes one date per line and was not affected; anyone who entered another waste service's calendar was told about collections that had been cancelled."
K26 = "<b><code>BYSETPOS</code>, <code>BYMONTH</code> and <code>FREQ=YEARLY;BYDAY</code></b> were not evaluated. “Last working day of the month” matched every working day — 20 dates in February instead of one. These are exactly the forms waste services use for bulky waste, garden waste and the hazardous waste collection."
K27 = "<b>A calendar with <code>COUNT</code> ran out without anyone noticing.</b> The year-change warning only looked at <code>UNTIL</code>."
K28 = "<b><code>RDATE</code>, <code>RECURRENCE-ID</code> and <code>STATUS:CANCELLED</code></b> were ignored."
K29 = "<b>A <code>CHARSET=</code> on a single line</b> converted the whole file — “Restmülltonne” became “RestmÃ¼lltonne”, and permanently so."
K30 = "<b>The evening announcement required an exact minute match.</b> If a cron run overran the target minute, it was silently skipped until the next day."
K31 = "<b>Four of the eight bin types arrived nowhere.</b> Glass, bulky waste, garden waste and hazardous waste could be selected in the mapping table and had no effect."
K32 = "<b>HTTP and MQTT delivered different amounts</b> — 19 against 23 values. Both paths now calculate from the same function; they can no longer drift apart."
K33 = "<b>In four tabs, PHP source code appeared literally on the page.</b>"
K34 = "<b>The English language file translated MQTT topic names</b> — the English-speaking user subscribed to topics that do not exist."
K35 = "What has been added"
K36 = "The search patterns of the Loxone template now carry the separator (<code>\i;REST=\i\v</code>) and are created in a single place. Existing inputs without the semicolon keep working unchanged."
K37 = "In addition: up to four calendars, file upload, your own dates, quiet times and holiday, a second announcement, acknowledgement, free announcement texts, Loxone time, failure detection, gap detection, calendar diagnosis in the <i>Test</i> tab, LoxBerry notifications, a virtual output template, a form token, and a <code>?refresh=1</code> that does not go out to the network without a token — since 1.4.7 not in the form <code>?json=1&amp;refresh=1</code> either."
K38 = "The page now follows the house standard with five tabs; the bin mapping is a setting and therefore sits with the settings."
K39 = "Endpoints"
K40 = "Call"
K41 = "Purpose"
K42 = "<code>/plugins/awmabfuhr/awm.php</code>"
K43 = "Loxone line with all values"
K44 = "<code>/plugins/awmabfuhr/awm.php?debug=1</code>"
K45 = "additionally all dates, gaps and download errors"
K46 = "<code>/plugins/awmabfuhr/awm.php?json=1</code>"
K47 = "complete state as JSON"
K48 = "<code>/plugins/awmabfuhr/awm.php?text=1</code>"
K49 = "three ready-made sentences and the notice text"
K50 = "<code>/plugins/awmabfuhr/awm.php?ics=1</code>"
K51 = "the stored calendar for subscribing"
K52 = "<code>/plugins/awmabfuhr/awm.php?say=1&amp;token=…</code>"
K53 = "play the announcement immediately <b>(token required)</b>"
K54 = "<code>/plugins/awmabfuhr/awm.php?ptest=1&amp;token=…</code>"
K55 = "trigger a test push message <b>(token required)</b>"
K56 = "<code>/plugins/awmabfuhr/awm.php?ack=1&amp;token=…</code>"
K57 = "acknowledge “bin is outside” <b>(token required)</b>"
K58 = "<code>/plugins/awmabfuhr/awm.php?renew=1&amp;token=…</code>"
K59 = "try the year renewal now <b>(token required)</b>"
K60 = "<code>/plugins/awmabfuhr/awm.php?refresh=1&amp;token=…</code>"
K61 = "download the calendar again immediately <b>(token required)</b>"
K62 = "<code>/plugins/awmabfuhr/awm.php?selftest=1&amp;token=…</code>"
K63 = "only check whether the token is correct — triggers nothing"
K64 = "<code>&amp;cal=2</code> selects the second calendar, <code>&amp;cal=3</code> the third — up to <code>&amp;cal=4</code>."
K65 = "Setting it up (AWM Munich)"
K66 = "<a href='https://www.awm-muenchen.de/abfall-entsorgen/muelltonnen/abfuhrkalender' target='_blank'>Open the AWM collection calendar</a>, enter street and house number, “Weiter”."
K67 = "On the result page, right-click the iCal export link (“Termine als iCal/ICS”) and copy it."
K68 = "Enter the link in the plugin page as “iCal address” and save."
K69 = "Click “Download now” — done; from then on the plugin keeps the dates up to date automatically."
K70 = "If your own waste service offers no permanent address but only a file to download: hand the file over under “Upload a calendar file”."
K71 = "Data protection"
K72 = "There are <b>no personal data</b> in the plugin. The address is held solely in the locally stored iCal address (<code>config/plugins/awmabfuhr/awm.json</code>); with AWM it contains street and house number. External connections exist only to the configured calendar server. On uninstall the backup copies next to the plugin folder are removed as well — they contain the same address and the action token."
