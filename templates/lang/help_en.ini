; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Waste collection calendar AWM Munich"
K02 = "Brings the collection calendar of AWM Munich (the municipal waste management company) — or any other iCal/ICS collection calendar with bin names in the appointment titles — into Loxone: which bin is due <b>tomorrow</b>, which <b>today</b>, and in how many days the next collection is. Plus an optional <b>evening announcement</b> (TTS through the Music Server/Audioserver), <b>MQTT</b> publishing and <b>JSON</b>."
K03 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, runs with PHP 7.4 and 8.x)."
K04 = "Features"
K05 = "iCal/ICS import by URL, adjustable fetch interval; the calendar is stored persistently (survives restarts and outages of the waste company's server)"
K06 = "Expands AWM <b>recurring appointments</b> correctly on its own (RRULE FREQ=WEEKLY + INTERVAL + UNTIL + EXDATE) including the individual „attention“ shifted dates around public holidays — the note about the shift is additionally displayed as text"
K07 = "Bin detection: residual waste, organic waste, paper, recyclables / yellow bin"
K08 = "<b>Loxone text line</b>, compatible one-to-one with the widespread muell.php format (<code>MUELL;REST=..;BIO=..;PAPIER=..;DATUM=..</code>), extended by <code>WERT</code>, <code>OK</code>, <code>WARN</code>, today flags (<code>HREST</code> …) and day counters (<code>TREST</code> …)"
K09 = "<b>Evening announcement</b> (TTS) at the configured time through the Music Server/Audioserver (zones with individual volume, <code>zone~volume</code>) or through a URL template of your own — once a day, and only if something is due tomorrow"
K10 = "<b>MQTT</b> through the LoxBerry MQTT gateway (on change and every 30 min): <code>awm/rest_morgen</code>, <code>_heute</code>, <code>tage_*</code>, <code>datum_*</code>, <code>ok</code>, <code>warnung</code>, <code>hinweis</code> plus the notification flags <code>ann</code>, <code>audio</code>, <code>push</code>, <code>ptest</code>"
K11 = "<b>JSON endpoint</b> for third-party software (<code>?json=1</code>)"
K12 = "<b>Turn-of-the-year warning</b>: the AWM link contains the calendar year; if the calendar ends in &lt;30 days, the plugin warns in the interface, through <code>WARN=1</code> in Loxone and through MQTT"
K13 = "Tabs: Settings (with a step-by-step guide to the AWM website and „Fetch now“), Loxone integration (step by step including a complete list of blocks and practical notes on the notification block), Test, Log (with rotation)"
K14 = "The configuration, log and calendar survive plugin updates and reinstallation (a backup copy outside the plugin folder)"
K15 = "Endpoints"
K16 = "Setting up (AWM Munich)"
K17 = "<a href='https://www.awm-muenchen.de/abfall-entsorgen/muelltonnen/abfuhrkalender' target='_blank'>Open the AWM collection calendar</a>, enter the street and house number, „Weiter“."
K18 = "On the results page, right-click the iCal export link („Termine als iCal/ICS“) and copy it."
K19 = "Enter the link in the plugin interface as the „iCal calendar URL“ and save."
K20 = "Click „Fetch now“ — done; from then on the plugin keeps the dates up to date automatically."
K21 = "Privacy"
K22 = "The plugin contains <b>no personal data</b>. The address, or rather the calendar, is only contained in the locally stored iCal URL (<code>config/plugins/awmabfuhr/awm.json</code>). The only external connection is to the configured calendar server."
K23 = "Call"
K24 = "Purpose"
K25 = "<code>/plugins/awmabfuhr/awm.php</code>"
K26 = "Loxone line <code>MUELL;REST=..;BIO=..;PAPIER=..;DATUM=..;WERT=..;OK=..;WARN=..;HREST=..;…;TREST=..;…</code>"
K27 = "<code>/plugins/awmabfuhr/awm.php?debug=1</code>"
K28 = "additionally all appointments in the preview window"
K29 = "<code>/plugins/awmabfuhr/awm.php?refresh=1</code>"
K30 = "Fetch the calendar again immediately"
K31 = "<code>/plugins/awmabfuhr/awm.php?json=1</code>"
K32 = "complete state as JSON"
K33 = "<code>/plugins/awmabfuhr/awm.php?say=1&amp;token=...</code>"
K34 = "Test: play the evening announcement immediately"
