ZU12_TEXT = "<code>FETCH=0</code> heißt: der letzte Abrufversuch ist gescheitert. Die Termine stimmen dann meist trotzdem noch, weil der gespeicherte Kalender weiterläuft — es ist eine Vorwarnung, kein Alarm. Die Schwelle deutlich über den Abholtakt legen."
