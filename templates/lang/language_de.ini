H_VORLAGE_TEXT = "Die Vorlagen legen die Bausteine fertig an. In Loxone Config: Rechtsklick auf den Miniserver → „Vorlage einlesen“. Loxone legt dabei NEU an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine. Die Eingangs-Vorlage enthält nur die Tonnen, die in Ihrem Kalender wirklich vorkommen."
