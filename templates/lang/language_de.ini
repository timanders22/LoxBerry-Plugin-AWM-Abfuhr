P_VISU = "in der Visualisierung sichtbar"
P_INVERS = "invertiert"
ZU4 = "Zu #4:"
ZU4_TEXT = "Der Benachrichtigungs-Baustein sendet nur bei einer Flanke von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang — erst über ein ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen."
ZU9 = "Zu #9:"
ZU9_TEXT = "Die Quittierung geht an das Plugin zurück. Es lässt daraufhin die zweite Ansage am Abholmorgen aus — ohne diesen Baustein spricht das Haus auch dann, wenn die Tonne längst draußen steht."
ZU12 = "Zu #12:"
ZU12_TEXT = "<code>FETCH=0</code> heißt: der letzte Abrufversuch ist gescheitert. Die Termine stimmen dann meist trotzdem noch, weil der gespeicherte Kalender weiterläuft — es ist eine Vorwarnung, kein Alarm. Die Schwelle deutlich über den Abholtakt legen."
ZU13 = "Zu #13:"
ZU13_TEXT = "<code>TNEXT</code> ist die Zahl, die man in der App sehen will. Für ein Datum eignet sich <code>SNEXT</code>: das ist Loxone-Zeit (Sekunden seit 01.01.2009) und lässt sich unmittelbar als Datum formatieren."
S7 = "Schritt 7: Gegenprobe"
S7_TEXT = "Im Reiter „Test“ auf „Loxone-Zeile abrufen“ klicken — das ist genau das, was der Miniserver bekommt. Danach in Loxone Config die Werte der virtuellen Eingänge ansehen. Steht dort überall 0, fehlt meist das Abo im MQTT-Gateway (Schritt 2) oder die Adresse im virtuellen Eingang zeigt auf den falschen Rechner."
