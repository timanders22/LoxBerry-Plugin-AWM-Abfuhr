S1 = "Schritt 1: den Weg festlegen"
S1_TEXT = "MQTT ist der Regelweg: ein Abo, und alle Werte kommen an — auch die, die später dazukommen. Der virtuelle HTTP-Eingang ist die Ausnahme für Anlagen ohne MQTT-Gateway; er fragt alle 300 Sekunden nach und braucht je Wert einen eigenen Befehl. Beide Wege liefern dasselbe."
S2 = "Schritt 2: Das Abo im MQTT-Gateway"
S2_TEXT = "Die Themengruppe dieses Plugins lautet:"
S3 = "Schritt 3: virtuelle Eingänge anlegen (nur ohne MQTT nötig)"
S3_TEXT = "Einen „Virtuellen HTTP-Eingang“ anlegen, darin je Wert einen „Virtuellen HTTP-Eingang Befehl“. Bequemer geht es mit der Vorlage weiter unten — sie legt alle auf einmal an."
S3_BEFEHLE = "Die Befehle im Einzelnen. Der Suchtext steht zwischen <code>\i</code> und <code>\i</code>, <code>\v</code> nimmt die Zahl dahinter:"
S3_SEMIKOLON = "Der Suchtext trägt das Semikolon mit. Das ist kein Schönheitsfehler: der Feldname <code>WERT=</code> steckt auch in <code>HWERT=</code> und <code>TWERT=</code>, und Loxone nimmt die erste Fundstelle. Bisher ging das nur gut, weil die kurzen Namen in der Zeile vorn stehen. Mit dem vorangestellten Semikolon ist jeder Suchtext eindeutig."
S3_KOMPAT = "Bestehende Eingänge ohne Semikolon funktionieren unverändert weiter — die Zeile beginnt nach wie vor mit <code>MUELL;REST=…</code> und ist damit 1:1 zum klassischen muell.php."
S4 = "Schritt 4: Befehle senden (virtueller Ausgang)"
S4_TEXT = "Diese Adressen lösen etwas aus und verlangen deshalb das Aktionstoken. Die Vorlage weiter unten legt sie fertig an."
T_ZWECK = "Zweck"
T_ADRESSE = "Adresse"
A_SAY = "Ansage jetzt sprechen"
A_PTEST = "Test-Pushnachricht auslösen"
A_ACK = "Quittierung „Tonne steht draußen“"
A_RENEW = "Jahres-Erneuerung jetzt versuchen"
A_SELFTEST = "nur prüfen, ob das Token stimmt"
S4_TOKEN = "Wird ein neues Token erzeugt, wirken die alten Adressen nicht mehr. Dann die Vorlage für den virtuellen Ausgang neu einlesen."
S5 = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Virtuelle Eingänge behalten ihren letzten Wert. Schweigt das Plugin, sieht in der App alles normal aus. Deshalb liefert es <code>FETCH</code> (letzter Abruf erfolgreich), <code>AGE</code> (Alter der Kalenderdatei in Stunden) und <code>LETZTER</code> (letzter Termin im Kalender). Sinnvolle Schwelle für <code>AGE</code>: deutlich über dem Abruf-Intervall, bei 14 Tagen etwa 500 Stunden. <code>OK</code> steht auf 0, sobald die Daten eines Kalenders mit Adresse älter sind als das Dreifache des Abruf-Intervalls (bei 14 Tagen 1008 Stunden); hochgeladene Kalender sind davon ausgenommen."
S6 = "Schritt 6: komplette Baustein-Liste zum Nachbauen"
