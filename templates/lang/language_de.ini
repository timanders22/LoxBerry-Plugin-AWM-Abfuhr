[QUELLEN]
H_WEITERE = "Andere Entsorger einrichten"
EINLEITUNG = "Das Plugin liest jeden iCal-/ICS-Export, nicht nur den der AWM. Einstieg ist immer die <b>Abfuhrkalender-Seite des eigenen Entsorgers</b> - nicht die Seite des Software-Anbieters dahinter: dort kann man keine Adresse eingeben. Beim Entsorger die Adresse eintragen, den Export-Link mit der rechten Maustaste kopieren und oben einfügen. Danach im Reiter „Tonnen“ die Bezeichnungen zuordnen, die wirklich in der Datei stehen. Die folgenden Systeme stecken hinter vielen deutschen Abfuhrkalendern - die Hinweise helfen beim Wiedererkennen."
SONST = "Ein anderer Entsorger? Auf dessen Abfuhrkalender-Seite nach <b>iCal</b>, <b>ICS</b> oder <b>Kalender abonnieren</b> suchen. Nahezu jeder deutsche Entsorger bietet einen solchen Export an - eine eigene Schnittstelle braucht das Plugin nicht."
HINWEIS_JAHR = "Steht im Link eine Jahreszahl, versucht das Plugin die Erneuerung zum Jahreswechsel selbst. Gelingt sie nicht, steht das im Protokoll - dann einmal den frischen Link beim Entsorger holen."
ABFALLIO = "Zu erkennen daran, dass der Export-Link auf <span class='sm-mono'>api.abfall.io</span> zeigt. Adresse eingeben, Abfallarten auswählen, dann mit der <b>rechten Maustaste</b> auf die Schaltfläche <b>ICS</b> und Link-Adresse kopieren. Der Link enthält ein Zeitfenster wie <span class='sm-mono'>timeperiod=20260101-20261231</span> - das zählt das Plugin zum Jahreswechsel selbst hoch."
JUMOMIND = "Zu erkennen am Webmodul unter <span class='sm-mono'>...jumomind.com/webmodul/&lt;gemeinde&gt;/</span>. Die Sammeladresse <b>ohne</b> Gemeinde ist gesperrt und meldet <i>Forbidden</i> - den Einstieg verlinkt der Entsorger auf seiner eigenen Seite, alternativ führt die MyMüll-App hin. Ort, Straße und Hausnummer wählen, dann den <b>iCal</b>-Download mit der rechten Maustaste kopieren."
ATURIS = "Das AbfallKalenderSystem von ATURIS, im Einsatz bei vielen Stadtwerken. Im Abfuhrkalender des Entsorgers Ort, Straße und Hausnummer wählen und die Schaltfläche für den <b>ICS</b>-Download mit der rechten Maustaste kopieren."

[HINWEIS]
LABEL = "Stichwörter für Feiertagsverschiebungen"
ERKLAERUNG = "Kommagetrennt. Findet sich eines dieser Wörter im Titel oder in der Beschreibung eines Einzeltermins der nächsten 14 Tage, zeigt das Plugin ihn als Hinweis an und gibt ihn per MQTT weiter. Der AWM München schreibt <b>Achtung</b> – deshalb steht das Wort an erster Stelle und darf nicht fehlen. Andere Entsorger formulieren anders; leeres Feld setzt die Standardliste zurück."
