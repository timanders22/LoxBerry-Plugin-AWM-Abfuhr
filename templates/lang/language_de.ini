S5_TEXT = "Virtuelle Eingänge behalten ihren letzten Wert. Schweigt das Plugin, sieht in der App alles normal aus. Deshalb liefert es <code>FETCH</code> (letzter Abruf erfolgreich), <code>AGE</code> (Alter der Kalenderdatei in Stunden) und <code>LETZTER</code> (letzter Termin im Kalender). Sinnvolle Schwelle für <code>AGE</code>: deutlich über dem Abruf-Intervall, bei 14 Tagen etwa 500 Stunden."
