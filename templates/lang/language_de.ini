H_TITEL = "Einbindung in Loxone — Schritt für Schritt"
S1 = "Schritt 1: MQTT einschalten"
S1_TEXT = "MQTT ist der Weg des Musterprojekts: das Plugin veröffentlicht alle Werte, das MQTT-Gateway des LoxBerry reicht sie an den Miniserver. Ab Werk ist MQTT im Plugin an (eine Anlage aus einer Fassung vor 1.4.25 behält ihre Einstellung) – im Reiter MQTT den Haken „MQTT aktivieren“ prüfen. Der Weg über HTTP (Virtueller HTTP-Eingang, Abfrage alle 300 Sekunden) bleibt für bestehende Anlagen erhalten (unten, „Bestehende Anlagen: Weg über HTTP“); neue Anlagen nehmen MQTT. Beide Wege rechnen aus derselben Stelle."
S2 = "Schritt 2: das MQTT-Gateway"
S2_TEXT = "Die Themengruppe dieses Plugins lautet:"
S3 = "Schritt 3: Eingänge anlegen (Namenstabelle)"
S3_TEXT = "Für die Werte über das MQTT-Gateway gibt es keine Vorlage zum Einlesen: in Loxone Config je Wert einen Virtuellen Eingang anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), für die vier Texte einen Virtuellen Texteingang. Der Name muss genau so lauten wie in der Tabelle – unter diesem Namen schickt das Gateway den Wert (Kopierknopf daneben). Die Tabelle folgt Ihrem Kalender 1: Tonnen, die er nicht kennt, fehlen."
S3_BEFEHLE = "Die Befehle im Einzelnen. Der Suchtext steht zwischen <code>\i</code> und <code>\i</code>, <code>\v</code> nimmt die Zahl dahinter:"
S3_SEMIKOLON = "Der Suchtext trägt das Semikolon mit. Das ist kein Schönheitsfehler: der Feldname <code>WERT=</code> steckt auch in <code>HWERT=</code> und <code>TWERT=</code>, und Loxone nimmt die erste Fundstelle. Bisher ging das nur gut, weil die kurzen Namen in der Zeile vorn stehen. Mit dem vorangestellten Semikolon ist jeder Suchtext eindeutig."
S3_KOMPAT = "Bestehende Eingänge ohne Semikolon funktionieren unverändert weiter — die Zeile beginnt nach wie vor mit <code>MUELL;REST=…</code> und ist damit 1:1 zum klassischen muell.php."
S4 = "Schritt 4: Befehle über MQTT"
S4_TEXT = "Loxone schickt Befehle über einen Virtuellen Ausgang an den UDP-Eingang des MQTT-Gateways; das Plugin nimmt sie nur mit dem Haken „Befehle über MQTT annehmen“ im Reiter MQTT an (ab Werk aus). Unter Gateway V1 und V2 ist dafür nichts einzutragen oder anzuhaken. Im Musterprojekt hängen die Befehle am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“; die „Vorlage: MQTT-Befehle“ unten legt einen eigenen Ausgang mit denselben Befehlen an."
T_ZWECK = "Zweck"
T_ADRESSE = "Adresse"
A_SAY = "Ansage jetzt sprechen"
A_PTEST = "Test-Pushnachricht auslösen"
A_ACK = "Quittierung „Tonne steht draußen“"
A_RENEW = "Jahres-Erneuerung jetzt versuchen"
A_SELFTEST = "nur prüfen, ob das Token stimmt"
S4_TOKEN = "Wird ein neues Token erzeugt, wirken die alten Adressen nicht mehr. Dann die Vorlage für den virtuellen Ausgang neu einlesen."
S5 = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Virtuelle Eingänge behalten ihren letzten Wert. Schweigt das Plugin oder das MQTT-Gateway, sieht in der App alles normal aus. Das Lebenszeichen <code>%1$s</code> zählt bei jedem Minutenlauf eins weiter (0 bis 999) – an einer Analogwertvalidierung mit Tmc 900 Sekunden (15 Läufe; der UDP-Eingang des Gateways verliert unter Last einzelne Meldungen, eine einzelne Lücke meldet nichts). Dazu <code>%2$s</code> (0 = keine gültigen Kalenderdaten; 0, sobald die Daten eines Kalenders mit Adresse älter sind als das Dreifache des Abruf-Intervalls, bei 14 Tagen 1008 Stunden; hochgeladene Kalender sind davon ausgenommen; geht bei jedem Minutenlauf hinaus). Für die Fehlersuche: <code>%3$s</code> (letzter Abruf erfolgreich), <code>%4$s</code> (Alter der Kalenderdatei in Stunden) und <code>%5$s</code> (letzter Termin, -1 = keine Kalenderdaten). Die Seite „Abfuhrkalender“ in Schritt 6 verbindet Lebenszeichen und OK zu einer Störungsmeldung. Über HTTP heißen die Werte ZAEHLER, OK, FETCH, AGE und LETZTER."
S6 = "Schritt 6: Die Bausteine, drei Seiten zum Nachbauen"
T_NAME = "Name"
T_PARAM = "Parameter"
T_EINGAENGE = "Eingänge verbinden mit"
S7 = "Schritt 7: Gegenprobe"
S7_TEXT = "Probe über MQTT: Reiter MQTT – Haken „MQTT aktivieren“ an, Autostart des Gateways an (sonst steht oben im Reiter MQTT eine Warnung)? In Loxone Config die Werte von <code>%s</code> ansehen – er muss jede Minute weiterzählen. Steht er, fehlt meist das Abo bzw. der Haken (Schritt 2). „Loxone-Zeile abrufen“ im Reiter Test zeigt dieselben Zahlen, wie sie der Weg über HTTP liefert."
T_EIGENSCHAFT = "Eigenschaft"
T_WERT = "Wert"
T_ZYKLUS = "Abfragezyklus"
T_SEKUNDEN = "Sekunden"
T_SUCHTEXT = "Befehlserkennung"
T_TYP = "Typ"
T_BEDEUTUNG = "Bedeutung"
ANALOG = "analog"
DIGITAL = "digital"
H_VORLAGE = "Alles auf einmal anlegen"
H_VORLAGE_TEXT = "Die Vorlagen legen die Bausteine fertig an. In Loxone Config: Peripherie → Virtuelle Eingänge bzw. Virtuelle Ausgänge → Vorlage importieren. Loxone legt dabei NEU an und überschreibt nichts – zweimal eingelesen ergibt doppelte Bausteine. Die Eingangs-Vorlage enthält nur die Tonnen, die in Ihrem Kalender wirklich vorkommen. Die Vorlage der MQTT-Befehle gehört zum Weg des Musterprojekts (die Eingänge legt man nach Schritt 3 an); die HTTP-Vorlagen darunter sind für bestehende Anlagen."
TOKEN_WARN = "Ein neues Token macht alle bisherigen Adressen in Loxone ungültig. Danach die Vorlage für den virtuellen Ausgang noch einmal einlesen."
BS_SP_NR = "#"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
BILD_ALT = "Bausteine des Plugins in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
BAUSTEINE_VORTEXT = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden. Wer nur wissen will, ob alles läuft und wann die nächste Abholung ist, übernimmt die erste allein; jede weitere Seite steht für sich (keine Leitung geht über eine Seitengrenze). Die Tabellen zeigen nur die Tonnen, die Ihr Kalender 1 kennt – fehlt eine, rücken die Nummern nach (das Musterprojekt zeigt alle acht)."
BS1_KOPF = "Abfuhrkalender – läuft das Plugin? Kalender gültig, Kalenderende, nächste Abholung"
BS1_S1 = "Im Plugin Reiter „Einstellungen“ unter „Datenquellen“ die iCal-Adresse des eigenen Entsorgers eintragen (oder unter „Kalenderdatei hochladen“ die .ics-Datei übergeben), speichern und „Jetzt abrufen“. Reiter „MQTT“: „MQTT aktivieren“ angehakt (ab Werk an) und, für die Befehle Nr. 19 und auf Seite 3, „Befehle über MQTT annehmen“ anhaken und speichern. Reiter „Einbindung in Loxone“, Schritt 2: unter Gateway V2 die Datenpunkte der Hakenliste anhaken (unter V1 ist nichts einzutragen)."
BS1_S2 = "Die Eingänge nach der Namenstabelle in Schritt 3 anlegen: je Wert einen Virtuellen Eingang (Peripherie → Virtuelle Eingänge → Virtueller Eingang, „Als Digitaleingang verwenden“ nicht aktivieren), für Texte einen Virtuellen Texteingang, Name genau so. Wer die Seite aus dem Musterprojekt kopiert, bekommt sie mit. Die Befehle an das Plugin hängen am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Adresse /dev/udp/loxberry/11884); wer ihn noch nicht hat, liest die „Vorlage: MQTT-Befehle“ ein (Peripherie → Virtuelle Ausgänge → Vorlage importieren) und nimmt deren Befehle."
BS1_S3 = "Seite „Abfuhrkalender“ anlegen. Die acht Eingänge Nr. 1 bis 8 auf die Seite ziehen, dazu eine Konstante mit dem Wert 1 (Nr. 9) und den Befehl Nr. 19 („Abfuhrkalender: Kalender-Link erneuern“, publish awm/befehl/erneuern 1) am Ausgang „LoxBerry MQTT-Gateway“."
BS1_S4 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Plugin gestört (Abfuhr)“ und „Meldung Kalender läuft aus (Abfuhr)“, Texte wie in der Liste, auf die Seite ziehen. Jede bekommt genau eine Leitung (von Nr. 13 und von Nr. 5). Den Virtuellen Eingang „Taste Kalender-Link erneuern (Abfuhr)“ als Taste anlegen (Nr. 18). Die zwei Virtuellen Texteingänge Nr. 20 und Nr. 21 von Hand anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Namen genau so, „In Visualisierung verwenden“ an."
BS1_S5 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden; das ODER hat zwei Eingänge. An der Analogwertvalidierung Nr. 10 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an und die Störmeldung löst nie aus). Status „Zustand (Abfuhr)“: vorher viermal „+“ klicken (V5 bis V8); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
BS1_S6 = "Speichern und übertragen. Probe: awm_status_zaehler zählt jede Minute weiter; „Zustand (Abfuhr)“ zeigt „läuft – Kalenderdatei … h alt“, „Nächste Abholung (Abfuhr)“ den fertigen Satz des Plugins."
BS1_H1 = "Die Störmeldung kommt erst nach 10 Minuten; „Lebenszeichen fehlt“ (LoxBerry aus, Minutenlauf oder MQTT-Gateway steht) frühestens nach 15 Minuten. Steht etwas davon, behalten alle Eingänge ihren letzten Wert – nur der stehende Zähler awm_status_zaehler an Nr. 10 verrät es."
BS1_H2 = "Ein gescheiterter Abruf (awm_abruf = 0) ist kein Alarm: die gespeicherten Termine gelten weiter, der Status sagt es. Wer früh wissen will, dass der Server des Entsorgers streikt, hängt ein NICHT an awm_abruf über eine Einschaltverzögerung von einem Tag an eine eigene Benachrichtigung."
BS1_H3 = "Zu Nr. 16: die Meldung kommt einmal beim Umspringen – und nach jedem Übertragen erneut, solange awm_warnung anliegt."
BS1_H4 = "Verschiebungen wegen Feiertagen stehen schon im Kalender des Entsorgers (awm_hinweis_da und der Text awm_hinweis zeigen den Hinweis) – nichts mit dem Betriebsmodus „Feiertag“ nachbauen."
BS1_H5 = "Befehle über MQTT brauchen kein Token: das Plugin nimmt sie nur mit dem Haken „Befehle über MQTT annehmen“ an (ab Werk aus), denselben Befehl mit demselben Wert höchstens einmal je Minute. Die Quittung steht im Plugin Reiter Test, nicht in Loxone; die Wirkung zeigen die Werte (z. B. awm_ptest, awm_ack)."
BS1_H6 = "Zweiter Kalender (z. B. Ferienhaus): im Reiter „Einstellungen“ unter „Tonnenzuordnung“ den Kalender wählen, dann hier die Vorlage holen (die Befehle heißen awm_2_…, die Themen awm/2/…) und die Seiten kopieren; Ansage und Erneuerung für ihn senden publish awm/befehl/2/ansage 1 bzw. awm/befehl/2/erneuern 1 (Test-Push und Quittierung gelten für alle Kalender). Seine Störung über ein weiteres ODER (zwei Eingänge) vor Nr. 13 führen – nie zwei Quellen direkt an eine Benachrichtigung."
BS1_H7 = "Bewusst nicht im Muster, aber in der Vorlage: awm_zeit_… (je Tonne), awm_zeit_next und awm_letzter – Loxone-Zeit (Sekunden seit 01.01.2009) für ein eigenes Datumsformat; awm_letzter ist -1 ohne Kalenderdaten und 0 bei einem Kalender ohne Ende."
BS2_KOPF = "Abfuhrkalender Tonnen – alle acht Tonnenarten: morgen, heute, Tage bis zur Leerung"
BS2_S1 = "Die Eingänge aus der Namenstabelle (Seite „Abfuhrkalender“, Schritt 2) genügen – jede Tonne hat dort ihre drei Namen."
BS2_S2 = "Seite „Abfuhrkalender Tonnen“ anlegen. Je Tonne die drei Befehle morgen, heute und Tage (z. B. awm_rest_morgen, awm_rest_heute, awm_tage_rest) auf die Seite ziehen und einen Status daneben setzen (Baustein-Suche, Taste F5); die Zeilen wie in der Liste eintragen, die ohne Bedingung zuletzt."
BS2_S3 = "Speichern und übertragen. Probe: der Status der Tonne, die als nächste kommt, nennt dieselben Tage wie der Kopf des Plugins."
BS2_H1 = "Tonnen, die Ihr Kalender nicht kennt, fehlen in Ihrer Vorlage und in der Tabelle oben – das Musterprojekt zeigt alle acht. Glas, Sperrmüll, Grünschnitt und Schadstoffe erkennt das Plugin erst nach einer Zuordnung (Reiter „Einstellungen“, „Tonnenzuordnung“) oder über eigene Termine."
BS2_H2 = "Bis zum ersten Wert nach dem Übertragen zeigen die Status „kein Termin in den nächsten 35 Tagen“ (die Tage-Befehle starten mit -1). Über MQTT kommen die Werte bei jeder Änderung und spätestens nach 30 Minuten im vollen Satz."
BS2_H3 = "Die Tage zählt das Plugin im Vorschau-Fenster (Reiter „Einstellungen“, ab Werk 35 Tage); wer es ändert, passt die letzte Statuszeile an."
BS3_KOPF = "Abfuhrkalender Erinnerung und Ansage – Schaltsignale, Vorabend-Push, Quittierung, Test-Push und Ansage"
BS3_S1 = "Im Plugin Reiter „Einstellungen“, Abschnitt „Benachrichtigungen“: „Pushnachricht aktiv“, „Ansage aktiv“ und „Erinnerungs-Uhrzeit am Vorabend“ (ab Werk 18:00) prüfen; Abschnitt „Sprachausgabe“: den Lautsprecher wählen; Abschnitt „Ruhezeiten“ nach Wunsch. Reiter „MQTT“: „Befehle über MQTT annehmen“ angehakt."
BS3_S2 = "Seite „Abfuhrkalender Erinnerung und Ansage“ anlegen. Die Eingänge der Liste ziehen (die morgen-Werte, awm_tage_next und awm_ok ein weiteres Mal), vom Ausgang „LoxBerry MQTT-Gateway“ die drei Befehle „Abfuhrkalender: Tonne draußen quittieren“, „Abfuhrkalender: Test-Push auslösen“ und „Abfuhrkalender: Ansage jetzt sprechen“. Die zwei Virtuellen Texteingänge Nr. 41 und Nr. 42 von Hand anlegen (Peripherie → Virtuelle Eingänge → Virtueller Texteingang), Namen genau so, „In Visualisierung verwenden“ an."
BS3_S3 = "Drei Virtuelle Eingänge als Taste anlegen („Taste Tonne steht draußen (Abfuhr)“, „Taste Test-Push (Abfuhr)“, „Taste Abfuhr-Ansage (Abfuhr)“) und einen als Schalter („Niemand zu Hause (eigene Quelle)“ – wer eine eigene Anwesenheit hat, nimmt deren Ausgang). Vier Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Tonne rausstellen (Abfuhr)“, „Meldung Test-Push (Abfuhr)“, „Meldung Tonne noch nicht draußen (Abfuhr)“ und „Meldung Tonne reinholen (Abfuhr)“, Texte wie in der Liste; jede bekommt genau eine Leitung."
BS3_S4 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen – drei Formeln, ein ODER, sieben UND, zwei Impuls um, zwei Status –, Parameter wie in der Liste, von oben nach unten verbinden; jedes UND und ODER hat zwei Eingänge. Am UND Nr. 20 und am UND Nr. 29 den Eingang I2 negieren: auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status „Abfuhr heute und morgen (Abfuhr)“ und „Meldewege (Abfuhr)“: vorher einmal „+“ klicken (V5)."
BS3_S5 = "Speichern und übertragen. Probe: „Taste Test-Push (Abfuhr)“ drücken – gleich darauf kommt „Meldung Test-Push (Abfuhr)“ aufs Handy; im Plugin Reiter Test steht die Quittung „angenommen“."
BS3_H1 = "„Morgen Abfuhr (Abfuhr)“ (Nr. 11) und „Heute Abfuhr (Abfuhr)“ (Nr. 14) sind fertige Schaltsignale für eigene Logik; „Tonne noch nicht draußen (Abfuhr)“ (Nr. 20) schaltet z. B. eine Erinnerungsleuchte, bis die Taste gedrückt ist."
BS3_H2 = "Digitale Werte gehen mit ihrem Ausgang Q direkt an UND und Benachrichtigung – KEIN Schwellwertschalter dazwischen; er gäbe bei jedem neu gesendeten Wert einen kurzen Impuls und damit eine Meldung."
BS3_H3 = "Die Vorabend-Ansage spricht das Plugin selbst über die gemeinsame Sprachausgabe – dafür ist kein Baustein nötig. Die „Taste Abfuhr-Ansage (Abfuhr)“ spricht sofort, auch in der Ruhezeit des Plugins, aber nicht, solange „Niemand zu Hause“ an ist. Bei der Ausgabeart „Original-Audioserver“ spricht das Plugin nicht; dafür hat das Muster keinen Weg."
BS3_H4 = "Quittieren am Vorabend gilt bis zum Abholmorgen: die zweite Ansage am Abholmorgen (Reiter „Einstellungen“, „Zweite Ansage am Abholmorgen“, ab Werk aus) entfällt dann. Danach steht awm_ack wieder auf 0 – für die nächste Abholung wird neu quittiert."
BS3_H5 = "Die Pushnachricht kann nicht sagen, welche Tonne – das steht in der App im Status „Abfuhr heute und morgen (Abfuhr)“ (fertige Sätze awm_text_morgen und awm_text_heute) und auf der Seite „Abfuhrkalender Tonnen“."
BS3_H6 = "„Meldung Tonne rausstellen“ und „Meldung Test-Push“ hängen ohne Verzögerung am Signal: nach jedem Übertragen melden sie erneut, solange es anliegt. awm_ptest steht 5 Minuten auf 1; das Plugin sendet ihn sofort nach dem Befehl. Kommt die Test-Meldung nicht, zuerst im Plugin Reiter Test die Quittung ansehen."
Z1_01 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_ok | 1 = Kalenderdaten vorhanden und gültig; 0 = kein Kalender eingerichtet, keine Termine, Daten älter als dreimal das Abruf-Intervall (ab Werk 42 Tage) oder der Abruf einer neu eingetragenen Adresse ist gescheitert (weitere Instanz auf Seite „Abfuhrkalender Erinnerung und Ansage“) | —"
Z1_02 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_status_zaehler | Lebenszeichen 0 bis 999, zählt bei jedem Minutenlauf eins weiter (kommt jede Minute, nie retained) | —"
Z1_03 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_abruf | 1 = der letzte Abruf beim Entsorger gelang; 0 = gescheitert – die gespeicherten Termine gelten weiter (Vorwarnung, kein Alarm) | —"
Z1_04 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_alter | Alter der Kalenderdatei in Stunden; -1 = keine Datei | —"
Z1_05 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_warnung | 1 = der Kalender liefert in weniger als 30 Tagen keine Termine mehr (Jahreswechsel) | —"
Z1_06 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_luecke | Tage bis zum nächsten Abholtermin, den der Entsorger ersatzlos gestrichen hat; 0 = keiner | —"
Z1_07 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_hinweis_da | 1 = der Entsorger meldet in den nächsten 14 Tagen eine Verschiebung (z. B. wegen eines Feiertags) | —"
Z1_08 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Abfuhrkalender (AWM & iCal)) | awm_tage_next | Tage bis zur nächsten Abholung irgendeiner Tonne; 0 = heute, -1 = keine in den nächsten 35 Tagen (weitere Instanz auf Seite „Abfuhrkalender Erinnerung und Ansage“) | —"
Z1_09 = "Konstante | Konstante 1 | Wert 1 | —"
Z1_10 = "Analogwertvalidierung | Lebenszeichen fehlt (Abfuhr) | Tmc 900 s (15 Minutenläufe; eine einzelne verlorene Meldung des Gateways meldet nichts), Min 0, Max 999 – steht der LoxBerry, der Minutenlauf oder das MQTT-Gateway, bleibt der Zähler stehen; Haken bei ‚En‘ im Eigenschaftsfenster entfernen | V = #2, En = #9"
Z1_11 = "NICHT | Keine frischen Daten (Abfuhr) | — (keine gültigen Kalenderdaten) | I = #1"
Z1_12 = "ODER | Störung (Abfuhr) | — (keine frischen Daten oder Lebenszeichen fehlt) | I1 = #11, I2 = Ausgang E von #10"
Z1_13 = "Einschaltverzögerung | Störung bestätigt (Abfuhr) | 600 s (ein Neustart und eine einzelne Lücke melden nichts) | Eingang = #12"
Z1_14 = "Benachrichtigung | Meldung Plugin gestört (Abfuhr) | Text: Abfuhrkalender – seit 10 Minuten keine gültigen Termine: LoxBerry, MQTT-Gateway oder Plugin antwortet nicht, oder der Kalender fehlt bzw. ist veraltet. Erinnerungen kommen dann nicht. In der App den Status „Zustand (Abfuhr)“ lesen | Eingang = #13"
Z1_15 = "Status | Zustand (Abfuhr) | Zeilen: V1 = 1 „Lebenszeichen fehlt seit mindestens 15 Minuten – LoxBerry, MQTT-Gateway oder Minutenlauf des Plugins steht; im Plugin Reiter MQTT prüfen, ob ‚MQTT aktivieren‘ angehakt ist und das Gateway auf Autostart steht, dann Reiter ‚Einbindung in Loxone‘, Schritt 2 (Abo bzw. Haken)“; V2 = 0 und V4 < 0 „noch kein Kalender – im Plugin Reiter Einstellungen unter ‚Datenquellen‘ die iCal-Adresse eintragen oder die Kalenderdatei hochladen, dann ‚Jetzt abrufen‘“; V2 = 0 „keine gültigen Termine – Kalender zu alt (<v4> h) oder der Abruf einer neuen Adresse scheiterte; im Plugin Reiter Einstellungen ‚Jetzt abrufen‘, dann Reiter Test ‚Alle Termine (Debug)‘ ansehen“; V5 = 1 „Kalender endet in weniger als 30 Tagen – die Jahres-Erneuerung läuft von selbst; klappt sie nicht, neuen iCal-Link beim Entsorger holen“; V3 = 0 „letzter Abruf gescheitert – die gespeicherten Termine gelten weiter (Datei <v4> h alt); den Grund zeigt im Plugin Reiter Test ‚Alle Termine (Debug)‘“; V6 > 0 „in <v6> Tagen fällt eine Abholung ersatzlos aus – im Plugin Reiter Test ‚Alle Termine (Debug)‘ ansehen“; V7 = 1 „der Entsorger meldet eine Verschiebung: <v8>“; ohne Bedingung „läuft – Kalenderdatei <v4> h alt“; Visualisierung EIN | V1 = Ausgang E von #10, V2 = #1, V3 = #3, V4 = #4, V5 = #5, V6 = #6, V7 = #7, V8 = #21"
Z1_16 = "Benachrichtigung | Meldung Kalender läuft aus (Abfuhr) | Text: Abfuhrkalender – der Kalender liefert in weniger als 30 Tagen keine Termine mehr. Das Plugin versucht die Jahres-Erneuerung selbst; klappt sie nicht, beim Entsorger den neuen iCal-Link holen und im Plugin Reiter Einstellungen unter „Datenquellen“ eintragen | Eingang = #5"
