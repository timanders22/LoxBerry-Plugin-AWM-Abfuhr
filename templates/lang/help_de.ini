; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Abfuhrkalender AWM München"
K02 = "Bringt den Abfuhrkalender des AWM München (Abfallwirtschaftsbetrieb) — oder jeden anderen iCal-/ICS-Abfuhrkalender mit Tonnen-Namen in den Termin-Titeln — in Loxone: Welche Tonne ist <b>morgen</b> fällig, welche <b>heute</b>, und in wie vielen Tagen kommt die nächste Leerung. Dazu optionale <b>Vorabend-Ansage</b> (TTS über Music Server/Audioserver), <b>MQTT</b>-Veröffentlichung und <b>JSON</b>."
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, läuft mit PHP 7.4 und 8.x)."
K04 = "Funktionen"
K05 = "iCal-/ICS-Import per URL, Abruf-Intervall einstellbar; der Kalender wird persistent gespeichert (übersteht Neustarte, Ausfälle des Entsorger-Servers)"
K06 = "Rollt AWM-<b>Serientermine</b> korrekt selbst aus (RRULE FREQ=WEEKLY + INTERVAL + UNTIL + EXDATE) inkl. der einzelnen „Achtung“-Verschiebungstermine rund um Feiertage — der Verschiebungshinweis wird zusätzlich als Text angezeigt"
K07 = "Tonnen-Erkennung: Restmüll/Hausmüll, Bio, Papier, Wertstoff/Gelbe Tonne"
K08 = "<b>Loxone-Textzeile</b>, 1:1 kompatibel zum verbreiteten muell.php-Format (<code>MUELL;REST=..;BIO=..;PAPIER=..;DATUM=..</code>), erweitert um <code>WERT</code>, <code>OK</code>, <code>WARN</code>, Heute-Flags (<code>HREST</code> …) und Tage-Zähler (<code>TREST</code> …)"
K09 = "<b>Vorabend-Ansage</b> (TTS) zur konfigurierten Uhrzeit über Music Server/Audioserver (Zonen mit individueller Lautstärke, <code>Zone~Lautstärke</code>) oder über eine eigene URL-Vorlage — einmal pro Tag, nur wenn morgen etwas fällig ist"
K10 = "<b>MQTT</b> über das LoxBerry MQTT Gateway (bei Änderung + alle 30 min): <code>awm/rest_morgen</code>, <code>_heute</code>, <code>tage_*</code>, <code>datum_*</code>, <code>ok</code>, <code>warnung</code>, <code>hinweis</code> sowie die Melde-Merker <code>ann</code>, <code>audio</code>, <code>push</code>, <code>ptest</code>"
K11 = "<b>JSON-Endpunkt</b> für Drittsoftware (<code>?json=1</code>)"
K12 = "<b>Jahreswechsel-Warnung</b>: Der AWM-Link enthält das Kalenderjahr; endet der Kalender in &lt;30 Tagen, warnt das Plugin in der Oberfläche, per <code>WARN=1</code> in Loxone und per MQTT"
K13 = "Reiter: Einstellungen (mit Laien-Anleitung zur AWM-Website und „Jetzt abrufen“), Einbindung in Loxone (Schritt-für-Schritt inkl. kompletter Baustein-Liste und Praxis-Hinweisen zum Benachrichtigungs-Baustein), Test, Protokoll (mit Rotation)"
K14 = "Konfiguration, Log und Kalender überleben Plugin-Updates und Neuinstallation (Sicherungskopie außerhalb des Plugin-Ordners)"
K15 = "Endpunkte"
K16 = "Einrichtung (AWM München)"
K17 = "<a href='https://www.awm-muenchen.de/abfall-entsorgen/muelltonnen/abfuhrkalender' target='_blank'>AWM-Abfuhrkalender öffnen</a>, Straße und Hausnummer eingeben, „Weiter“."
K18 = "Auf der Ergebnisseite den iCal-Export-Link („Termine als iCal/ICS“) mit der rechten Maustaste kopieren."
K19 = "Link in der Plugin-Oberfläche als „iCal-Kalender-URL“ eintragen, speichern."
K20 = "„Jetzt abrufen“ klicken — fertig; ab dann hält das Plugin die Termine automatisch aktuell."
K21 = "Datenschutz"
K22 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Adresse bzw. Kalender stecken ausschließlich in der lokal gespeicherten iCal-URL (<code>config/plugins/awmabfuhr/awm.json</code>). Externe Verbindungen gibt es nur zum konfigurierten Kalender-Server."
K23 = "Aufruf"
K24 = "Zweck"
K25 = "<code>/plugins/awmabfuhr/awm.php</code>"
K26 = "Loxone-Zeile <code>MUELL;REST=..;BIO=..;PAPIER=..;DATUM=..;WERT=..;OK=..;WARN=..;HREST=..;…;TREST=..;…</code>"
K27 = "<code>/plugins/awmabfuhr/awm.php?debug=1</code>"
K28 = "zusätzlich alle Termine im Vorschau-Fenster"
K29 = "<code>/plugins/awmabfuhr/awm.php?refresh=1</code>"
K30 = "Kalender sofort neu abrufen"
K31 = "<code>/plugins/awmabfuhr/awm.php?json=1</code>"
K32 = "kompletter Zustand als JSON"
K33 = "<code>/plugins/awmabfuhr/awm.php?say=1&amp;token=...</code>"
K34 = "Test: Vorabend-Ansage sofort abspielen"
