; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Abfuhrkalender AWM München"
K02 = "Bringt den Abfuhrkalender des AWM München (Abfallwirtschaftsbetrieb) — oder jeden anderen iCal-/ICS-Abfuhrkalender mit Tonnen-Namen in den Termin-Titeln — in Loxone: Welche Tonne ist <b>morgen</b> fällig, welche <b>heute</b>, und in wie vielen Tagen kommt die nächste Leerung. Dazu <b>Vorabend-Ansage</b> (TTS über Music Server/Audioserver), <b>MQTT</b>-Veröffentlichung und <b>JSON</b>."
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, läuft mit PHP 7.4 und 8.x)."
K04 = "Funktionen"
K05 = "iCal-/ICS-Import per Adresse <b>oder als hochgeladene Datei</b>, Abruf-Intervall einstellbar; der Kalender wird dauerhaft gespeichert und übersteht Neustarts, Updates und Ausfälle des Entsorger-Servers"
K06 = "Rollt <b>Serientermine</b> selbst aus: <code>FREQ=DAILY/WEEKLY/MONTHLY/YEARLY</code> mit <code>INTERVAL</code>, <code>BYDAY</code>, <code>BYMONTHDAY</code>, <code>BYMONTH</code>, <code>BYSETPOS</code>, <code>WKST</code>, <code>COUNT</code>, <code>UNTIL</code>, <code>EXDATE</code>, <code>RDATE</code> und <code>RECURRENCE-ID</code>. Was das Plugin <b>nicht</b> auswerten kann, sagt es im Reiter <i>Test</i> — es rät nicht"
K07 = "<b>Acht Tonnenarten</b>: Restmüll/Hausmüll, Bio, Papier, Wertstoff/Gelbe Tonne, Glas, Sperrmüll, Grünschnitt, Schadstoffe. Alle acht kommen über die Loxone-Zeile, MQTT, die Vorlage und die Ansage an"
K08 = "<b>Zuordnungstabelle je Kalender</b>: die Oberfläche zeigt, welche Bezeichnungen wirklich in der Datei stehen, und was das Plugin daraus macht — samt der Angabe, was eine eigene Regel dabei verdrängt"
K09 = "<b>Eigene Termine</b> von Hand (Weihnachtsbaum, Sperrmüll auf Abruf)"
K10 = "<b>Loxone-Textzeile</b>, 1:1 kompatibel zum verbreiteten muell.php-Format (<code>MUELL;REST=..;BIO=..;PAPIER=..;DATUM=..</code>), erweitert um Heute-Flags, Tage-Zähler, Datum je Tonne, <b>Loxone-Zeit</b> zum Rechnen, die nächste Abholung überhaupt, Ausfallerkennung und die Melde-Merker"
K11 = "<b>Vorabend-Ansage</b> und optional eine <b>zweite Ansage am Abholmorgen</b> („Steht die Tonne schon draußen?“), Text frei wählbar mit Platzhaltern"
K12 = "<b>Ruhezeiten</b>: nachts nicht sprechen, im Urlaub nicht sprechen (Quelle ist das Plugin <i>Ferien und Feiertage</i>, falls installiert), oder bis zu einem Datum ganz aussetzen"
K13 = "<b>Quittierung</b> aus Loxone zurück ans Plugin (<code>?ack=1</code>) — danach entfällt die Morgen-Ansage"
K14 = "<b>MQTT</b> über das LoxBerry MQTT Gateway, bei jeder Änderung und alle 30 min als Lebenszeichen. <b>Alle</b> Werte der Loxone-Zeile, dazu Hinweistext und drei fertige Sätze"
K15 = "<b>Zwei Loxone-Vorlagen</b> zum Einlesen: virtuelle Eingänge (nur die Tonnen, die im eigenen Kalender vorkommen) und ein virtueller Ausgang für die auslösenden Aufrufe samt Token"
K16 = "<b>Ausfallerkennung</b>: Alter der Kalenderdatei, Erfolg des letzten Abrufs, letzter Termin im Kalender — als eigene Werte für Loxone"
K17 = "<b>Lücken-Erkennung</b>: streicht der Entsorger einen Termin, ohne einen Ersatz zu nennen, wird das angezeigt statt verschwiegen"
K18 = "<b>Warnungen im LoxBerry-Meldebereich</b> bei ausgelaufenem Kalender, dreimal gescheitertem Abruf und misslungener Jahres-Erneuerung"
K19 = "<b>Jahres-Erneuerung</b>: Endet der Kalender in weniger als 30 Tagen, versucht das Plugin selbst einen frischen Link — mit eigenen Strategien für AWM München, Abfallplus/abfall.io, Jumomind/MyMüll und ATURIS"
K20 = "Konfiguration, Protokoll und Kalender überleben Plugin-Updates und eine Neuinstallation"
K21 = "Neu in 1.4.0"
K22 = "Diese Fassung geht auf eine zeilenweise Durchsicht mit zwei Prüfagenten zurück. Gemessen wurde gegen den echten Parser des Plugins und gegen einen echten AWM-Export (73 Abholtage im Jahr 2026); die Münchner Erkennung ist danach Zeile für Zeile dieselbe geblieben."
K23 = "Was still falsch war"
K24 = "<b>Die Loxone-Vorlage vertauschte acht Eingänge.</b> <code>MUELL_REST</code> war als analog 0–365 mit der Einheit „Tage“ deklariert und führt in Wahrheit 0/1; <code>MUELL_TREST</code> war digital 0–1 und führt den Tage-Zähler. Loxone Config nimmt so eine Datei klaglos an — der Fehler fällt erst in der App auf. <code>WARN</code> trug außerdem den Kommentar eines anderen Feldes."
K25 = "<b><code>EXDATE:a,b,c</code> in einer Zeile</b> ließ nur die erste Ausnahme wirken. Der Münchner Export schreibt ein Datum je Zeile und war davon nicht betroffen; wer den Kalender eines anderen Entsorgers eintrug, bekam Abholtermine gemeldet, die abgesagt waren."
K26 = "<b><code>BYSETPOS</code>, <code>BYMONTH</code> und <code>FREQ=YEARLY;BYDAY</code></b> wurden nicht ausgewertet. „Letzter Werktag des Monats“ traf jeden Werktag — 20 Termine im Februar statt einem. Genau diese Formen benutzen Entsorger für Sperrmüll, Grünschnitt und das Schadstoffmobil."
K27 = "<b>Ein Kalender mit <code>COUNT</code> lief leer, ohne dass es jemand erfuhr.</b> Die Jahreswechsel-Warnung sah nur auf <code>UNTIL</code>."
K28 = "<b><code>RDATE</code>, <code>RECURRENCE-ID</code> und <code>STATUS:CANCELLED</code></b> wurden nicht beachtet."
K29 = "<b>Ein <code>CHARSET=</code> an einer einzelnen Zeile</b> rechnete die ganze Datei um — aus „Restmülltonne“ wurde „RestmÃ¼lltonne“, und zwar dauerhaft."
K30 = "<b>Die Vorabend-Ansage verlangte Minutengleichheit.</b> Zog ein Cron-Lauf über die Zielminute, entfiel sie still bis zum nächsten Tag."
K31 = "<b>Vier der acht Tonnenarten kamen nirgends an.</b> Glas, Sperrmüll, Grünschnitt und Schadstoffe waren in der Zuordnungstabelle wählbar und blieben folgenlos."
K32 = "<b>HTTP und MQTT lieferten verschieden viel</b> — 19 gegen 23 Werte. Beide Wege rechnen jetzt aus derselben Funktion; sie können nicht mehr auseinanderlaufen."
K33 = "<b>In vier Reitern stand PHP-Quelltext wörtlich in der Seite.</b>"
K34 = "<b>Die englische Sprachdatei übersetzte MQTT-Themennamen</b> — der englischsprachige Anwender abonnierte Themen, die es nicht gibt."
K35 = "Was dazugekommen ist"
K36 = "Die Suchtexte der Loxone-Vorlage tragen jetzt das Trennzeichen (<code>\i;REST=\i\v</code>) und entstehen an einer einzigen Stelle. Bestehende Eingänge ohne Semikolon funktionieren unverändert weiter."
K37 = "Dazu: bis zu vier Kalender, Datei-Upload, eigene Termine, Ruhezeiten und Urlaub, zweite Ansage, Quittierung, freie Ansagetexte, Loxone-Zeit, Ausfallerkennung, Lücken-Erkennung, Kalenderdiagnose im Reiter <i>Test</i>, LoxBerry-Meldungen, virtuelle Ausgangs-Vorlage, Formulartoken, und ein <code>?refresh=1</code>, das nicht mehr ohne Token ins Netz geht."
K38 = "Die Oberfläche folgt jetzt dem Hausstandard mit fünf Reitern; die Tonnenzuordnung ist eine Einstellung und steht deshalb bei den Einstellungen."
K39 = "Endpunkte"
K40 = "Aufruf"
K41 = "Zweck"
K42 = "<code>/plugins/awmabfuhr/awm.php</code>"
K43 = "Loxone-Zeile mit allen Werten"
K44 = "<code>/plugins/awmabfuhr/awm.php?debug=1</code>"
K45 = "zusätzlich alle Termine, Lücken und Abruffehler"
K46 = "<code>/plugins/awmabfuhr/awm.php?json=1</code>"
K47 = "kompletter Zustand als JSON"
K48 = "<code>/plugins/awmabfuhr/awm.php?text=1</code>"
K49 = "drei fertige Sätze und der Hinweistext"
K50 = "<code>/plugins/awmabfuhr/awm.php?ics=1</code>"
K51 = "der gespeicherte Kalender zum Abonnieren"
K52 = "<code>/plugins/awmabfuhr/awm.php?say=1&amp;token=…</code>"
K53 = "Ansage sofort abspielen <b>(Token nötig)</b>"
K54 = "<code>/plugins/awmabfuhr/awm.php?ptest=1&amp;token=…</code>"
K55 = "Test-Pushnachricht auslösen <b>(Token nötig)</b>"
K56 = "<code>/plugins/awmabfuhr/awm.php?ack=1&amp;token=…</code>"
K57 = "Quittierung „Tonne steht draußen“ <b>(Token nötig)</b>"
K58 = "<code>/plugins/awmabfuhr/awm.php?renew=1&amp;token=…</code>"
K59 = "Jahres-Erneuerung jetzt versuchen <b>(Token nötig)</b>"
K60 = "<code>/plugins/awmabfuhr/awm.php?refresh=1&amp;token=…</code>"
K61 = "Kalender sofort neu abrufen <b>(Token nötig)</b>"
K62 = "<code>/plugins/awmabfuhr/awm.php?selftest=1&amp;token=…</code>"
K63 = "nur prüfen, ob das Token stimmt — löst nichts aus"
K64 = "<code>&amp;cal=2</code> wählt den zweiten Kalender, <code>&amp;cal=3</code> den dritten und so fort."
K65 = "Einrichtung (AWM München)"
K66 = "<a href='https://www.awm-muenchen.de/abfall-entsorgen/muelltonnen/abfuhrkalender' target='_blank'>AWM-Abfuhrkalender öffnen</a>, Straße und Hausnummer eingeben, „Weiter“."
K67 = "Auf der Ergebnisseite den iCal-Export-Link („Termine als iCal/ICS“) mit der rechten Maustaste kopieren."
K68 = "Link in der Plugin-Oberfläche als „iCal-Adresse“ eintragen, speichern."
K69 = "„Jetzt abrufen“ klicken — fertig; ab dann hält das Plugin die Termine automatisch aktuell."
K70 = "Bietet der eigene Entsorger keine dauerhafte Adresse, sondern nur eine Datei zum Herunterladen: die Datei unter „Kalenderdatei hochladen“ übergeben."
K71 = "Datenschutz"
K72 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Die Adresse steckt ausschließlich in der lokal gespeicherten iCal-Adresse (<code>config/plugins/awmabfuhr/awm.json</code>); beim AWM enthält sie Straße und Hausnummer. Externe Verbindungen gibt es nur zum konfigurierten Kalender-Server. Beim Deinstallieren werden auch die Sicherungskopien neben dem Plugin-Ordner entfernt — sie enthalten dieselbe Adresse und das Aktionstoken."
