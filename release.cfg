[AUTOUPDATE]
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und
# steuert das Auto-Update.
#
# ACHTUNG - bei JEDEM Release muessen DREI Stellen dieselbe Version
# nennen, sonst laedt LoxBerry das falsche Archiv:
#
#   1. plugin.cfg   -> [PLUGIN] VERSION
#   2. release.cfg  -> VERSION            (diese Datei)
#   3. release.cfg  -> ARCHIVEURL und INFOURL (Tag vX.Y.Z im Pfad)
#
# Woher die Liste kommt: Im Entwurf zu 1.1.0 stand hier VERSION=1.1.0,
# waehrend beide URLs noch auf den Tag v1.0.2 zeigten. Wirkung waere
# gewesen: LoxBerry meldet ein Update auf 1.1.0, laedt aber das
# 1.0.2-Archiv - also ein stilles DOWNGRADE auf jeder Installation mit
# AUTOMATIC_UPDATES=true. Der Entwurf wurde nie veroeffentlicht; auf
# GitHub folgte auf 1.0.2 unmittelbar 1.2.0. Die Liste oben bleibt
# trotzdem stehen, denn der Fehler kostet beim naechsten Mal nichts
# weniger.

# Version des aktuellen Releases
VERSION=1.4.4
# Download-URL des ZIP-Archivs (von GitHub automatisch erzeugt)
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/archive/refs/tags/v1.4.4.zip

# URL mit weiteren Informationen zum Release
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/releases/tag/v1.4.4
