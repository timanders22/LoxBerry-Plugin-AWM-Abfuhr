[AUTHOR]
NAME=AWM Abfuhrkalender Plugin Authors
EMAIL=awmabfuhr@users.noreply.github.com

[PLUGIN]
VERSION=1.4.44
NAME=awmabfuhr
FOLDER=awmabfuhr
TITLE=Abfuhrkalender (AWM & iCal)

# Adresse der Dokumentation (seit 1.4.39, Modul-1.2.9-Welle 18.11.2026): LoxBerry liest sie bei der
# Installation (plugininstall.pl, PLUGIN.WEBSITE) und zeigt sie als Knopf "Dokumentation". Besitzer und
# Repository wie in ARCHIVEURL der release.cfg.
WEBSITE=https://github.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository).
# Bei einem neuen Release: VERSION hier und in release.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
