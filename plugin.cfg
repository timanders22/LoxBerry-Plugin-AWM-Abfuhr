PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-AWM-Abfuhr/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
